<style>
:root{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}}
:root[data-theme="light"]{--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}
:root[data-theme="dark"]{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:34px;height:34px;border-radius:50%;object-fit:cover;display:inline-block;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
button.on{border-color:var(--ac);color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 240px;min-width:0;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.bar input:focus{outline:2px solid var(--ac)}
.go{background:var(--ac);color:#033;border:0;font-weight:700;padding:10px 18px;border-radius:10px}
.pg{height:4px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:10px}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gd));transition:width .2s}
.st{font-size:.82rem;color:var(--mut);margin-top:6px;min-height:20px}.st.er{color:var(--er)}
.cw{position:relative;margin-top:8px}
canvas{width:100%;height:62vh;min-height:340px;display:block;touch-action:none;border:1px solid var(--bd);border-radius:12px;background:var(--bg);cursor:grab}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}.zb button{width:34px;padding:6px 0}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.hn{font-size:.8rem;color:var(--mut)}
.pt{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;word-break:break-all;color:var(--gd);font-weight:700}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.sm div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:.78rem}.sm span{display:block;color:var(--mut);font-size:.68rem}.sm b{color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cols h3{font-size:.85rem;margin:6px 0}
.rw{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;padding:6px 0;border-top:1px solid var(--bd);cursor:pointer}
.rw:hover{color:var(--ac)}.rw span{font-family:ui-monospace,Consolas,monospace}.rw b{color:var(--ac);white-space:nowrap}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
a.bt{display:inline-block;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:.85rem;text-decoration:none}
.ex{font-size:.78rem;color:var(--mut);margin-top:12px}
.lv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}
.dot.ok{background:var(--ac);animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--ac)}100%{box-shadow:0 0 0 8px transparent}}
#fd h3{font-size:.85rem;margin:2px 0 6px}a.rw{color:inherit;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
