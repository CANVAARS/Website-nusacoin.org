function proc(id,d,fresh){if(seen[id])return;seen[id]=1;FZ=!!fresh;var x=d.tx||d,vi=[],vo=[],tm=+x.timestamp||0;

 if(!live||!root||demoT||document.hidden||busy||pbusy)return;
 pbusy=true;var e0=ep,got=0,n0=NS.length;okc=0;
