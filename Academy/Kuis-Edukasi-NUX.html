<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Edukasi NUX</title>
<style>
:root{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}}
:root[data-theme="light"]{--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}
:root[data-theme="dark"]{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:680px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8dffd6,var(--ac));display:inline-grid;place-items:center;color:#033;font-weight:800;font-size:.8rem;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.b button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
.b button.on{border-color:var(--ac);color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px}
.go{background:var(--ac);color:#033;border:0;border-radius:10px;padding:11px 22px;font-weight:700;cursor:pointer;font:inherit;font-weight:700;margin-top:12px}
.hd{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut)}.hd b{color:var(--gd)}
.pr{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:8px 0 14px}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gd));transition:width .5s}
.q{font-size:1.08rem;font-weight:700;margin:0 0 12px}
.op{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;font:inherit;transition:.2s}
.op:hover:not([disabled]){border-color:var(--ac);transform:translateX(3px)}
.op[disabled]{cursor:default}
.op.ok{border-color:var(--ac);background:rgba(46,230,166,.15)}
.op.no{border-color:var(--er);background:rgba(255,107,107,.13);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:12px;font-size:.88rem;color:var(--mut)}.fb b{display:block;margin-bottom:2px;font-size:.95rem}.fb b.ok{color:var(--ac)}.fb b.no{color:var(--er)}
.big{font-size:3rem;font-weight:800;color:var(--ac);line-height:1.1;margin:6px 0}
.lv{display:inline-block;background:var(--gd);color:#321;border-radius:20px;padding:4px 14px;font-weight:700}
.ce input{width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:8px 0}
.ce input:focus{outline:2px solid var(--ac)}
canvas{width:100%;border-radius:10px;border:1px solid var(--bd);display:block}
.c{text-align:center}
.cf{position:fixed;top:-10px;font-size:20px;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
.hid{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1><span class="logo">N</span><span id="ttl"></span></h1>
<div class="b"><button id="bi" onclick="L('id')">ID</button> <button id="be" onclick="L('en')">EN</button> <button onclick="T()">◐</button></div></header>

<div class="box c" id="p0"><div style="font-size:2.6rem">🎓</div><p id="intro"></p><button class="go" id="gs" onclick="start()"></button></div>

<div class="box hid" id="p1">
<div class="hd"><span id="no"></span><span id="sc"></span></div>
<div class="pr"><i id="pr"></i></div>
<p class="q" id="qq"></p><div id="ops"></div>
<div class="fb" id="fb"></div>
<button class="go hid" id="nx" onclick="next()"></button>
</div>

<div class="box c hid" id="p2">
<div id="em" style="font-size:2.4rem"></div>
<div class="big" id="bg"></div><span class="lv" id="lv"></span>
<p id="rt" style="color:var(--mut)"></p>
<div class="ce hid" id="ce"><label id="nl" style="font-size:.85rem;color:var(--mut)"></label><input id="nm" maxlength="30" oninput="cert()" autocomplete="off"><canvas id="cv" width="1000" height="700"></canvas><button class="go" id="dl" onclick="dl()"></button></div>
<button class="btn" id="rp" onclick="start()" style="margin-top:12px"></button>
</div>
</div>
<script>
var N=10;
var I={id:{ttl:"Kuis Edukasi NUX",intro:"10 pertanyaan acak seputar Nusacoin (NUX): reward, blok, mempool, keamanan wallet, hingga ELNUX dan Nusa Wallet. Skor 7 ke atas mendapat sertifikat.",gs:"Mulai Kuis",nx:"Lanjut",fin:"Lihat Hasil",qn:"Pertanyaan",sk:"Skor",ok:"✅ Benar!",no:"❌ Kurang tepat.",rt:["Jangan menyerah, baca Panduan Pemula NUX lalu coba lagi.","Lumayan! Sedikit lagi menuju sertifikat.","Hebat! Pemahaman NUX Anda sudah kuat.","Luar biasa! Anda siap jadi duta NUX."],nl:"Nama untuk sertifikat",ph:"Nama Anda",dl:"Unduh Sertifikat (PNG)",rp:"Ulangi Kuis",
lv:["Calon Penambang","Pemula Cerdas","Penambang Handal","Ahli NUX"],c1:"SERTIFIKAT",c2:"Kuis Edukasi NUX",c3:"diberikan kepada",c4:"Skor",c5:"Level"},
en:{ttl:"NUX Education Quiz",intro:"10 random questions about Nusacoin (NUX): rewards, blocks, the mempool, wallet safety, ELNUX and Nusa Wallet. Score 7 or more to earn a certificate.",gs:"Start Quiz",nx:"Next",fin:"See Results",qn:"Question",sk:"Score",ok:"✅ Correct!",no:"❌ Not quite.",rt:["Don’t give up: read the NUX Beginner’s Guide and try again.","Nice! Just a little more for a certificate.","Great! Your NUX knowledge is solid.","Outstanding! You are ready to be a NUX ambassador."],nl:"Name for the certificate",ph:"Your name",dl:"Download Certificate (PNG)",rp:"Retake Quiz",
lv:["Rookie Miner","Smart Beginner","Skilled Miner","NUX Expert"],c1:"CERTIFICATE",c2:"NUX Education Quiz",c3:"awarded to",c4:"Score",c5:"Level"}};
var Q=[
{q:["Berapa reward blok Nusacoin saat ini?","What is the current Nusacoin block reward?"],o:[["3 NUX","30 NUX","300 NUX","1,5 NUX"],["3 NUX","30 NUX","300 NUX","1.5 NUX"]],a:1,e:["Setiap blok yang berhasil ditambang memberi reward 30 NUX bagi penambang.","Each successfully mined block pays the miner 30 NUX."]},
{q:["Berapa target waktu satu blok?","What is the target time per block?"],o:[["10 detik","2 menit","6 menit","1 jam"],["10 seconds","2 minutes","6 minutes","1 hour"]],a:2,e:["Target waktu blok adalah 6 menit (360 detik). Difficulty disesuaikan agar rata-ratanya mendekati angka ini.","The target block time is 6 minutes (360 seconds). Difficulty adjusts to keep the average close to it."]},
{q:["Berapa suplai maksimum NUX?","What is the maximum supply of NUX?"],o:[["21 juta","18 juta","1 juta","Tidak terbatas"],["21 million","18 million","1 million","Unlimited"]],a:1,e:["Suplai maksimum NUX dibatasi 18.000.000 koin.","The maximum supply of NUX is capped at 18,000,000 coins."]},
{q:["Berapa konfirmasi yang umumnya dianggap final dan aman?","How many confirmations are generally considered final and safe?"],o:[["0","1","6","100"],["0","1","6","100"]],a:2,e:["Setelah 6 konfirmasi, transaksi umumnya dianggap final. Pelacak transaksi NUX memakai acuan ini.","After 6 confirmations a transaction is generally considered final. The NUX transaction tracker uses this benchmark."]},
{q:["Hashrate tetap, difficulty naik. Apa dampaknya?","Hashrate stays the same but difficulty rises. What happens?"],o:[["Blok jadi lebih lambat","Blok jadi lebih cepat","Tidak ada perubahan","Reward menjadi dua kali"],["Blocks get slower","Blocks get faster","Nothing changes","Reward doubles"]],a:0,e:["Waktu blok rata-rata = difficulty × 2³² ÷ hashrate, jadi difficulty lebih tinggi membuat blok lebih lambat.","Average block time = difficulty × 2³² ÷ hashrate, so higher difficulty means slower blocks."]},
{q:["Apa itu mempool?","What is the mempool?"],o:[["Ruang tunggu transaksi yang belum masuk blok","Tempat menyimpan seed phrase","Daftar harga koin","Server milik satu penambang"],["The waiting room for transactions not yet in a block","A place to store seed phrases","A coin price list","A single miner’s server"]],a:0,e:["Transaksi yang sudah disiarkan menunggu di mempool sampai penambang memasukkannya ke blok.","A broadcast transaction waits in the mempool until a miner includes it in a block."]},
{q:["Apa itu TXID?","What is a TXID?"],o:[["Password wallet","ID unik transaksi (64 karakter hex)","Alamat penerima","Nomor urut blok"],["Wallet password","Unique transaction ID (64 hex characters)","Recipient address","Block number"]],a:1,e:["TXID adalah sidik jari unik sebuah transaksi. Tempel di pelacak atau explorer untuk melihat statusnya.","A TXID is a transaction’s unique fingerprint. Paste it in a tracker or explorer to see its status."]},
{q:["Siapa yang boleh mengetahui seed phrase atau private key Anda?","Who may know your seed phrase or private key?"],o:[["Hanya Anda","Admin explorer","Siapa pun yang memintanya","Teman dekat"],["Only you","The explorer admin","Anyone who asks","A close friend"]],a:0,e:["Siapa pun yang memegangnya bisa menguras saldo Anda. Tim resmi tidak akan pernah memintanya.","Whoever holds it can drain your balance. A legitimate team will never ask for it."]},
{q:["Sebuah transaksi bernilai 250.000.000 satuan terkecil. Berapa NUX?","A transaction is worth 250,000,000 smallest units. How many NUX is that?"],o:[["25 NUX","0,25 NUX","2,5 NUX","250 NUX"],["25 NUX","0.25 NUX","2.5 NUX","250 NUX"]],a:2,e:["1 NUX = 100.000.000 satuan terkecil, jadi 250.000.000 ÷ 100.000.000 = 2,5 NUX.","1 NUX = 100,000,000 smallest units, so 250,000,000 ÷ 100,000,000 = 2.5 NUX."]},
{q:["Jika waktu blok pas 6 menit, berapa blok per hari?","If block time is exactly 6 minutes, how many blocks per day?"],o:[["144","240","480","24"],["144","240","480","24"]],a:1,e:["24 jam × 60 menit ÷ 6 = 240 blok per hari, atau 7.200 NUX per hari pada reward 30 NUX.","24 hours × 60 minutes ÷ 6 = 240 blocks a day, or 7,200 NUX a day at a 30 NUX reward."]},
{q:["Apa fungsi jaringan testnet?","What is a testnet for?"],o:[["Uji coba fitur dengan koin tanpa nilai nyata","Menambang koin asli dengan lebih mudah","Menyimpan cadangan mainnet","Menukar NUX ke rupiah"],["Trying features out with coins that have no real value","Mining real coins more easily","Backing up the mainnet","Exchanging NUX for rupiah"]],a:0,e:["Testnet dipakai untuk mencoba tanpa risiko; koinnya tidak bernilai.","A testnet lets you experiment risk-free; its coins have no value."]},
{q:["Apa kegunaan OP_RETURN pada transaksi?","What is OP_RETURN used for in a transaction?"],o:[["Mempercepat konfirmasi blok","Menyimpan data kecil, misalnya hash dokumen","Membuat alamat baru","Mencetak koin tambahan"],["Speeding up block confirmation","Storing small data, such as a document hash","Creating a new address","Minting extra coins"]],a:1,e:["OP_RETURN menaruh data kecil di blockchain pada output yang tidak bisa dibelanjakan, misalnya bukti hash dokumen.","OP_RETURN places small data on the blockchain in an output that cannot be spent, for example as proof of a document hash."]},
{q:["Dalam alur miniPOS ELNUX, belanja dan struk dicatat dalam mata uang apa?","In the ELNUX miniPOS flow, what currency are purchases and receipts recorded in?"],o:[["Rupiah","NUX saja","Dolar AS","Poin nusan"],["Rupiah","NUX only","US dollars","Nusan points"]],a:0,e:["Belanja dan struk selalu dalam rupiah, jadi toko tetap menerima rupiah seperti biasa.","Purchases and receipts are always in rupiah, so stores keep accepting rupiah as usual."]},
{q:["Apa yang diterbitkan Mode Toko ELNUX setelah pelanggan membayar?","What does ELNUX Store Mode issue after the customer pays?"],o:[["Bonus poin nusan","Koin NUX baru","Voucher kertas","Pajak toko"],["Nusan bonus points","New NUX coins","Paper vouchers","Store tax"]],a:0,e:["Setelah bayar, Mode Toko menerbitkan bonus poin nusan lewat ELNUX. Besarnya ditentukan toko.","After payment, Store Mode issues bonus nusan points through ELNUX. The store decides the amount."]},
{q:["Toko memberi 1 nusan per Rp1.000 belanja. Berapa nusan untuk belanja Rp50.000?","A store gives 1 nusan per Rp1,000 spent. How many nusan for a Rp50,000 purchase?"],o:[["5","50","500","1"],["5","50","500","1"]],a:1,e:["50.000 ÷ 1.000 = 50 nusan. Tarif bonus ditentukan masing-masing toko.","50,000 ÷ 1,000 = 50 nusan. Each store sets its own bonus rate."]},
{q:["Toko memakai aturan 1 nusan = potongan Rp1. Pelanggan menukar 3.000 nusan. Berapa potongannya?","A store uses the rule 1 nusan = Rp1 discount. A customer redeems 3,000 nusan. What is the discount?"],o:[["Rp300","Rp3.000","Rp30.000","Rp1"],["Rp300","Rp3,000","Rp30,000","Rp1"]],a:1,e:["3.000 nusan × Rp1 = potongan Rp3.000 pada kunjungan berikutnya.","3,000 nusan × Rp1 = a Rp3,000 discount on the next visit."]},
{q:["Apa peran Lightning NUX di ELNUX?","What is the role of Lightning NUX in ELNUX?"],o:[["Menerbitkan dan memindahkan poin hampir tanpa biaya dan instan","Menambang blok lebih cepat","Mencetak struk termal","Menukar rupiah ke dolar"],["Issuing and moving points almost free of charge and instantly","Mining blocks faster","Printing thermal receipts","Exchanging rupiah for dollars"]],a:0,e:["Lightning NUX dipakai agar penerbitan dan perpindahan poin nyaris tanpa biaya, instan, dan tercatat rapi.","Lightning NUX makes issuing and moving points nearly free, instant and neatly recorded."]},
{q:["Apa yang tercetak di struk termal ELNUX saat pelanggan memakai poin?","What does the ELNUX thermal receipt show when a customer uses points?"],o:[["Subtotal rupiah, baris diskon poin, lalu sisa yang dibayar dalam rupiah","Hanya jumlah NUX","Private key pelanggan","Hanya saldo poin"],["The rupiah subtotal, a points discount line, then the remainder paid in rupiah","Only the NUX amount","The customer’s private key","Only the points balance"]],a:0,e:["Struk mencetak subtotal rupiah, baris diskon poin, dan sisa pembayaran dalam rupiah.","The receipt prints the rupiah subtotal, a points discount line, and the remaining rupiah payment."]},
{q:["Apa fungsi window.nusa.connect() pada ekstensi Nusa Wallet?","What does window.nusa.connect() do in the Nusa Wallet extension?"],o:[["Menghubungkan halaman web atau DApp ke wallet","Mempercepat mining","Mengubah tema browser","Menyimpan password email"],["Connects a web page or DApp to the wallet","Speeds up mining","Changes the browser theme","Stores email passwords"]],a:0,e:["Halaman atau DApp memanggilnya untuk meminta koneksi ke Nusa Wallet, tanpa perlu memasukkan private key ke halaman.","A page or DApp calls it to request a connection to Nusa Wallet, with no need to type a private key into the page."]},
{q:["Tool Pengirim Massal dipakai untuk apa?","What is the Bulk Sender tool used for?"],o:[["Mengirim NUX ke banyak alamat dari daftar CSV","Menambang blok","Membuat kode QR","Menghitung difficulty"],["Sending NUX to many addresses from a CSV list","Mining blocks","Creating QR codes","Calculating difficulty"]],a:0,e:["Pengirim Massal membaca daftar CSV lalu mengirim NUX ke banyak alamat sekaligus.","Bulk Sender reads a CSV list and sends NUX to many addresses at once."]},
{q:["Generator Promo Toko membantu toko membuat apa?","What does the Store Promo Generator help stores create?"],o:[["Banner dan kupon promo siap cetak atau bagikan","Blok baru","Alamat wallet","Laporan pajak"],["Print-ready or shareable promo banners and coupons","New blocks","Wallet addresses","Tax reports"]],a:0,e:["Pemilik toko mengisi nama, promo, dan persentase bonus poin, lalu jadi gambar tanpa perlu desainer.","Store owners enter a name, promo and bonus-point percentage, and get an image with no designer needed."]}
];
var lang='id',ph=0,ord=[],i=0,sc=0,perm=[],ch=-1;
try{if(localStorage.getItem('kq_l'))lang=localStorage.getItem('kq_l');else if((navigator.language||'').slice(0,2)==='en')lang='en'}catch(e){}
function $(x){return document.getElementById(x)}
function li(){return lang==='id'?0:1}
function shuf(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function L(l){lang=l;try{localStorage.setItem('kq_l',l)}catch(e){}ui()}
function T(){var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark')}
function lvl(){return sc>=9?3:sc>=7?2:sc>=5?1:0}
function show(p){ph=p;['p0','p1','p2'].forEach(function(k,n){$(k).className='box'+(k!=='p1'?' c':'')+(n===p?'':' hid')})}
function ui(){var t=I[lang];document.documentElement.lang=lang;document.title=t.ttl;$('ttl').textContent=t.ttl;$('bi').className=lang==='id'?'on':'';$('be').className=lang==='en'?'on':'';
 $('intro').textContent=t.intro;$('gs').textContent=t.gs;$('nl').textContent=t.nl;$('nm').placeholder=t.ph;$('dl').textContent=t.dl;$('rp').textContent=t.rp;
 if(ph===1)rq();if(ph===2)res(true)}
function start(){ord=shuf(Q.map(function(_,k){return k})).slice(0,N);i=0;sc=0;nq();show(1)}
function nq(){perm=shuf([0,1,2,3]);ch=-1;rq()}
function rq(){var t=I[lang],q=Q[ord[i]],h='';
 $('no').textContent=t.qn+' '+(i+1)+'/'+N;$('sc').innerHTML=t.sk+': <b>'+sc+'</b>';

 $('ops').innerHTML='';
 perm.forEach(function(o,pos){var b=document.createElement('button');b.className='op';b.textContent=q.o[li()][o];b.onclick=function(){pick(pos)};
  if(ch>=0){b.disabled=true;if(o===q.a)b.className+=' ok';else if(pos===ch)b.className+=' no'}
  $('ops').appendChild(b)});
 var fb=$('fb');if(ch>=0){var r=perm[ch]===q.a;fb.innerHTML='<b class="'+(r?'ok':'no')+'">'+(r?t.ok:t.no)+'</b>'+q.e[li()];$('nx').textContent=i===N-1?t.fin:t.nx;$('nx').className='go'}
 else{fb.innerHTML='';$('nx').className='go hid'}}
function pick(pos){if(ch>=0)return;ch=pos;if(perm[pos]===Q[ord[i]].a)sc++;rq()}

 $('ce').className='ce'+(sc>=7?'':' hid');
 if(sc>=7){cert();if(!keep)party()}}

 var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#07130f');g.addColorStop(1,'#0f2a20');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='#f5b942';x.lineWidth=6;x.strokeRect(24,24,W-48,H-48);x.lineWidth=1.5;x.strokeRect(40,40,W-80,H-80);
 var lg=x.createRadialGradient(480,120,4,500,130,44);lg.addColorStop(0,'#8dffd6');lg.addColorStop(1,'#2ee6a6');x.fillStyle=lg;x.beginPath();x.arc(500,120,42,0,7);x.fill();
 x.fillStyle='#033';x.font='800 40px system-ui';x.textAlign='center';x.fillText('N',500,134);
 x.fillStyle='#f5b942';x.font='700 46px Georgia,serif';x.fillText(t.c1,500,230);
 x.fillStyle='#e6f7ef';x.font='28px Georgia,serif';x.fillText(t.c2,500,276);

 x.fillStyle='#2ee6a6';var fs=58;x.font='700 '+fs+'px Georgia,serif';while(x.measureText(nm).width>800&&fs>26){fs-=2;x.font='700 '+fs+'px Georgia,serif'}x.fillText(nm,500,420);
 x.strokeStyle='#1d3a2e';x.lineWidth=2;x.beginPath();x.moveTo(200,444);x.lineTo(800,444);x.stroke();

 x.fillStyle='#86a89a';x.font='20px system-ui';x.fillText(new Date().toLocaleDateString(lang==='id'?'id-ID':'en-GB',{day:'numeric',month:'long',year:'numeric'}),500,580);
 x.fillStyle='#f5b942';x.font='600 20px system-ui';x.fillText('Nusachain (NUX)',500,630)}

ui();
