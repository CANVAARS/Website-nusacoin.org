<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelacak Transaksi Nusacoin</title>
<style>
:root{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}}
:root[data-theme="light"]{--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}
:root[data-theme="dark"]{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8dffd6,var(--ac));display:inline-grid;place-items:center;color:#033;font-weight:800;font-size:.8rem;animation:fl 3s ease-in-out infinite}
.b button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.b button.on{border-color:var(--ac);color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px}
.in{display:flex;gap:8px;flex-wrap:wrap}
.in input{flex:1 1 260px;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;min-width:0}
.in input:focus{outline:2px solid var(--ac)}
.go{background:var(--ac);color:#033;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer}
.msg{margin-top:10px;font-size:.88rem;color:var(--mut)}.msg.er{color:var(--er)}
.road{position:relative;height:64px;margin:22px 10px 6px}
.road:before{content:"";position:absolute;left:0;right:0;top:38px;height:6px;border-radius:4px;background:var(--bd)}
.fill{position:absolute;left:0;top:38px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--gd));width:0;transition:width 1.4s ease}
.fill:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.35) 10px 20px);animation:mv 1s linear infinite;border-radius:4px}
@keyframes mv{to{background-position:20px 0}}
.pkg{position:absolute;top:0;left:0;font-size:30px;transform:translateX(-50%);transition:left 1.4s ease;animation:bn 1s ease-in-out infinite}
@keyframes bn{50%{margin-top:-6px}}
.nd{position:absolute;top:32px;width:18px;height:18px;border-radius:50%;background:var(--bd);border:3px solid var(--bg);transform:translateX(-50%);transition:.5s}
.nd.d{background:var(--ac)}.nd.a{background:var(--gd);animation:pu 1.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(245,185,66,.7)}100%{box-shadow:0 0 0 14px rgba(245,185,66,0)}}
ol{list-style:none;margin:16px 0 0;padding:0}
li.s{display:flex;gap:12px;padding:10px 0;opacity:.45;transition:.5s;border-top:1px solid var(--bd)}
li.s.d,li.s.a{opacity:1}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bd);flex:none;font-size:1rem;transition:.5s}
li.d .ic{background:var(--ac);color:#033}li.a .ic{background:var(--gd);color:#321;animation:pu 1.4s infinite}
.s b{display:block}.s small{color:var(--mut)}
.dt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
.dt div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:.82rem;word-break:break-all}
.dt span{display:block;color:var(--mut);font-size:.72rem}
a{color:var(--ac)}
.fl{animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-4px)}}
.cf{position:fixed;top:-10px;font-size:20px;animation:fall 2.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1><span class="logo">N</span><span id="ttl"></span></h1>
<div class="b"><button id="bi" onclick="L('id')">ID</button> <button id="be" onclick="L('en')">EN</button> <button onclick="T()">◐</button></div></header>
<div class="box">
<div class="in"><input id="tx" placeholder="TXID (64 hex)" spellcheck="false" autocomplete="off"><button class="go" id="go" onclick="start()"></button></div>
<div class="msg" id="ms"></div>
</div>
<div class="box" id="tr" style="display:none">
<div class="road"><div class="fill" id="fl"></div><div class="nd" style="left:0%"></div><div class="nd" style="left:33.3%"></div><div class="nd" style="left:66.6%"></div><div class="nd" style="left:100%"></div><div class="pkg" id="pk">📦</div></div>
<ol id="st"></ol>
<div class="dt" id="dt"></div>
</div>
</div>
<script>
// Konfigurasi endpoint / endpoint configuration
var EX='https://explorer.nusacoin.org',API='https://api.nusacoin.org';
var I={id:{ttl:"Pelacak Transaksi Nusacoin",go:"Lacak",ph:"Tempel TXID (64 karakter hex)",bad:"TXID tidak valid. Harus 64 karakter hex.",wait:"Transaksi belum terlihat di jaringan. Mencari ulang otomatis tiap 15 detik…",net:"Gagal menghubungi API explorer. Mencoba lagi…",done:"Selesai: transaksi sudah 6 konfirmasi atau lebih.",live:"Memantau otomatis tiap 15 detik.",
s:[["Disiarkan","Transaksi dikenali jaringan"],["Masuk mempool","Menunggu penambang memasukkan ke blok"],["1 konfirmasi","Sudah masuk satu blok"],["6 konfirmasi","Dianggap final dan aman"]],
d:["Konfirmasi","Tinggi blok","Waktu","Total output (NUX)","Explorer"],open:"Buka di explorer"},
en:{ttl:"Nusacoin Transaction Tracker",go:"Track",ph:"Paste TXID (64 hex characters)",bad:"Invalid TXID. It must be 64 hex characters.",wait:"Transaction not visible on the network yet. Auto-retrying every 15 seconds…",net:"Could not reach the explorer API. Retrying…",done:"Done: the transaction has 6 or more confirmations.",live:"Auto-refreshing every 15 seconds.",
s:[["Broadcast","Transaction recognised by the network"],["In mempool","Waiting for a miner to include it in a block"],["1 confirmation","Included in one block"],["6 confirmations","Considered final and safe"]],
d:["Confirmations","Block height","Time","Total output (NUX)","Explorer"],open:"Open in explorer"}};
var lang='id',timer=null,last=null,txid='';
try{if(localStorage.getItem('pt_l'))lang=localStorage.getItem('pt_l');else if((navigator.language||'').slice(0,2)==='en')lang='en'}catch(e){}
function L(l){lang=l;try{localStorage.setItem('pt_l',l)}catch(e){}ui();if(last)draw(last)}
function T(){var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark')}
function ui(){var t=I[lang];document.documentElement.lang=lang;document.title=t.ttl;ttl.textContent=t.ttl;go.textContent=t.go;tx.placeholder=t.ph;bi.className=lang==='id'?'on':'';be.className=lang==='en'?'on':''}
function msg(k,e){ms.textContent=k?I[lang][k]:'';ms.className='msg'+(e?' er':'')}
function jf(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(t){try{return JSON.parse(t)}catch(e){return t}})}
// Ambil status: {st:0..4, conf, height, time, total}
async function query(id){
 var conf,h,tm,tot,found=false,net=true;
 try{var d=await jf(EX+'/ext/gettx/'+id);net=false;var x=d&&d.tx;
  if(x&&!d.error){found=true;h=x.blockindex;tm=x.timestamp;tot=x.total;
   conf=d.confirmations!=null?d.confirmations:(d.blockcount&&h?d.blockcount-h+1:(x.blockhash?1:0));
   if(x.total>1e6)tot=x.total/1e8;}
 }catch(e){}
 if(!found){try{var r=await jf(EX+'/api/getrawtransaction?txid='+id+'&decrypt=1');net=false;
  if(r&&typeof r==='object'&&r.txid){found=true;conf=r.confirmations||0;tm=r.time;
   if(r.vout)tot=r.vout.reduce(function(a,o){return a+(+o.value||0)},0);
   if(r.blockhash&&!conf)conf=1;}
 }catch(e){}}
 if(found){return{st:conf>=6?4:conf>=1?3:2,conf:conf||0,height:h,time:tm,total:tot}}
 try{var m=await jf(API+'/mempool');net=false;
  if((typeof m==='string'?m:JSON.stringify(m)).indexOf(id)>-1)return{st:2,conf:0}}catch(e){}
 return net?{st:-1}:{st:0}}
function fmt(ts){if(!ts)return '-';var n=+ts;if(n<1e12)n*=1000;return new Date(n).toLocaleString(lang==='id'?'id-ID':'en-GB')}
function draw(r){var t=I[lang],st=r.st<0?0:r.st,pct=[0,0,33.3,66.6,100][st];
 fl.style.width=pct+'%';pk.style.left=pct+'%';
 document.querySelectorAll('.nd').forEach(function(n,i){n.className='nd'+(i<st?' d':i===st?' a':'')});
 // st: 0 belum terlihat, 2 mempool, 3 1 konf, 4 6 konf; langkah selesai = st (disiarkan+mempool saat st>=2)
 var done=[st>=2,st>=2,st>=3,st>=4],act=done.indexOf(false);
 st=r.st;
 document.querySelectorAll('.nd').forEach(function(n,i){n.className='nd'+(done[i]?' d':i===act?' a':'')});
 var p2=[0,1,2,3].filter(function(i){return done[i]}).length;pct=[0,33.3,66.6,100][Math.max(0,p2-1)];if(p2===0)pct=0;
 fl.style.width=pct+'%';pk.style.left=pct+'%';
 st_.innerHTML=t.s.map(function(s,i){return '<li class="s '+(done[i]?'d':i===act?'a':'')+'"><span class="ic">'+(done[i]?'✓':i+1)+'</span><div><b>'+s[0]+'</b><small>'+s[1]+'</small></div></li>'}).join('');
 var cells=[[t.d[0],r.conf!=null&&r.st>=2?r.conf:'-'],[t.d[1],r.height||'-'],[t.d[2],fmt(r.time)],[t.d[3],r.total!=null?(+r.total).toLocaleString('en-US',{maximumFractionDigits:8}):'-']];
 dt.innerHTML=cells.map(function(c){return '<div><span>'+c[0]+'</span>'+c[1]+'</div>'}).join('')+'<div><span>'+t.d[4]+'</span><a target="_blank" rel="noopener" href="'+EX+'/tx/'+txid+'">'+t.open+'</a></div>'}
var st_,dt;
async function poll(){var r=await query(txid);
 if(r.st<0){msg('net',1);if(!last)draw({st:0})}
 else{var prev=last&&last.st;last=r;draw(r);
  if(r.st===0)msg('wait');else if(r.st>=4){msg('done');clearInterval(timer);timer=null;if(prev!==4)party()}else msg('live')}}
function party(){var e=['🪙','✨','🎉','📦'];for(var i=0;i<24;i++){var s=document.createElement('span');s.className='cf';s.textContent=e[i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(function(x){x.remove()},4500,s)}}
function start(){var v=tx.value.trim().toLowerCase();if(!/^[0-9a-f]{64}$/.test(v)){msg('bad',1);return}
 txid=v;last=null;clearInterval(timer);msg('wait');document.getElementById('tr').style.display='block';draw({st:0});poll();timer=setInterval(poll,15000)}
st_=document.getElementById('st');dt=document.getElementById('dt');
var el=['ttl','go','tx','ms','bi','be','fl','pk'];el.forEach(function(k){window[k]=document.getElementById(k)});
tx.addEventListener('keydown',function(e){if(e.key==='Enter')start()});
ui();
try{var q=location.hash.slice(1);if(/^[0-9a-fA-F]{64}$/.test(q)){tx.value=q;start()}}catch(e){}
</script>
</body>
</html>
