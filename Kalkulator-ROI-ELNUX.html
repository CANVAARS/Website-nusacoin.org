<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator ROI Promo ELNUX</title>
<style>
:root{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}}
:root[data-theme="light"]{--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}
:root[data-theme="dark"]{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8dffd6,var(--ac));display:inline-grid;place-items:center;color:#033;font-weight:800;font-size:.8rem;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
button.on{border-color:var(--ac);color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}
.sub{color:var(--mut);font-size:.85rem;margin:8px 0 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mut)}
input[type=number]{width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit;margin-top:4px}
input[type=number]:focus{outline:2px solid var(--ac)}
small{display:block;font-size:.7rem;color:var(--mut);margin-top:2px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sts div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:.78rem}
.sts span{display:block;color:var(--mut);font-size:.7rem}.sts b{font-size:1.02rem;color:var(--ac);word-break:break-word}
.sts b.neg{color:var(--er)}
.vd{margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--bd);font-weight:600;font-size:.92rem}
.vd.ok{border-color:var(--ac);background:rgba(46,230,166,.12)}.vd.no{border-color:var(--er);background:rgba(255,107,107,.12)}
.ch{display:flex;align-items:stretch;gap:6px;height:170px;margin-top:10px}
.cl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.66rem;color:var(--mut);min-width:0}
.cl .t{position:relative;width:100%;flex:1}
.cl .bar{position:absolute;left:12%;right:12%;border-radius:5px 5px 0 0;transition:height .3s}
.cl .p{background:var(--ac)}.cl .n{background:var(--er);border-radius:0 0 5px 5px}
.cl .z{position:absolute;left:0;right:0;height:1px;background:var(--bd)}
.cl.cur .l{color:var(--gd);font-weight:700}
.cl .v{white-space:nowrap;font-size:.62rem}
.cp{margin-top:12px;background:var(--ac);color:#033;border:0;font-weight:700;padding:10px 18px;border-radius:10px}
.ex{font-size:.78rem;color:var(--mut);margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1><span class="logo">N</span><span id="ttl"></span></h1>
<div><button id="bi" onclick="L('id')">ID</button> <button id="be" onclick="L('en')">EN</button> <button onclick="T()">◐</button></div></header>
<p class="sub" id="sb"></p>
<div class="box"><div class="g" id="in"></div></div>
<div class="box"><div class="sts" id="rs"></div><div class="vd" id="vd"></div>
<button class="cp" id="cp" onclick="cop()"></button></div>
<div class="box"><b id="ct"></b><div class="ch" id="ch"></div><div class="sub" id="cn"></div></div>
<p class="ex" id="ex"></p>
</div>
<script>
var F=[['om',30000000,1000000],['mg',40,1],['bp',5,.5],['rd',60,5],['up',15,1],['ot',200000,50000]];
var I={id:{ttl:"Kalkulator ROI Promo ELNUX",sb:"Hitung apakah bonus poin nusan layak untuk toko Anda: biaya poin yang ditukar dibanding tambahan laba dari pelanggan yang kembali.",
f:[["Omzet bulanan saat ini (Rp)","Sebelum promo"],["Margin kotor (%)","Laba kotor dari tiap rupiah penjualan"],["Bonus poin (% dari belanja)","Nilai poin: 1 nusan = potongan Rp1"],["Tingkat penukaran poin (%)","Porsi poin yang akhirnya ditukar diskon"],["Kenaikan omzet karena pelanggan kembali (%)","Perkiraan Anda sendiri"],["Biaya promo lain per bulan (Rp)","Banner, cetak, dan sejenisnya"]],
r:["Tambahan omzet / bulan","Poin nusan diterbitkan","Biaya poin yang ditukar","Tambahan laba kotor","Laba bersih promo / bulan","ROI promo","Titik impas kenaikan omzet"],
ok:"Promo menguntungkan: tambahan laba kotor lebih besar dari biaya poin dan biaya lain.",no:"Promo belum menguntungkan pada angka ini. Naikkan perkiraan kunjungan, turunkan bonus, atau kurangi biaya lain.",neg:"Bonus yang ditukar (setelah dikali tingkat penukaran) melebihi margin kotor, sehingga promo tidak pernah impas.",
be:"Promo impas bila omzet naik minimal ",ct:"Laba bersih promo per skenario kenaikan omzet",cn:"Batang hijau = untung, merah = rugi. Skenario yang dipilih ditandai emas.",cp:"Salin ringkasan",cd:"Ringkasan tersalin!",
ex:"Perhitungan sederhana: poin dianggap seluruhnya berupa potongan harga (1 nusan = Rp1) dan hanya poin yang ditukar yang menjadi biaya. Biaya transaksi Lightning NUX dianggap nyaris nol. Hasilnya perkiraan untuk membantu keputusan, bukan jaminan.",sm:"Ringkasan promo ELNUX"},
en:{ttl:"ELNUX Promo ROI Calculator",sb:"Check whether nusan bonus points pay off for your store: the cost of redeemed points versus the extra profit from returning customers.",
f:[["Current monthly revenue (Rp)","Before the promo"],["Gross margin (%)","Gross profit on each rupiah of sales"],["Bonus points (% of purchase)","Point value: 1 nusan = Rp1 discount"],["Point redemption rate (%)","Share of points eventually redeemed as discounts"],["Revenue uplift from returning customers (%)","Your own estimate"],["Other promo costs per month (Rp)","Banners, printing and the like"]],
r:["Extra revenue / month","Nusan points issued","Cost of redeemed points","Extra gross profit","Net promo profit / month","Promo ROI","Break-even revenue uplift"],
ok:"The promo pays off: extra gross profit exceeds point cost and other costs.",no:"The promo does not pay off at these numbers. Raise the visit estimate, lower the bonus, or cut other costs.",neg:"Redeemed bonus (after the redemption rate) exceeds the gross margin, so the promo can never break even.",
be:"The promo breaks even if revenue grows by at least ",ct:"Net promo profit by revenue-uplift scenario",cn:"Green bars = profit, red = loss. Your chosen scenario is marked in gold.",cp:"Copy summary",cd:"Summary copied!",
ex:"Simple model: points are treated entirely as price discounts (1 nusan = Rp1) and only redeemed points count as cost. Lightning NUX transaction fees are assumed near zero. Results are estimates to support a decision, not a guarantee.",sm:"ELNUX promo summary"}};
var lang='id',V={},last={};
try{if(localStorage.getItem('rq_l'))lang=localStorage.getItem('rq_l');else if((navigator.language||'').slice(0,2)==='en')lang='en'}catch(e){}
function $(i){return document.getElementById(i)}
function nf(n,d){return (+n).toLocaleString(lang==='id'?'id-ID':'en-US',{maximumFractionDigits:d||0})}
function rp(n){return (n<0?'-':'')+'Rp'+nf(Math.abs(n))}
function sh(n){var a=Math.abs(n),s=n<0?'-':'';return s+(a>=1e9?nf(a/1e9,1)+(lang==='id'?' M':' B'):a>=1e6?nf(a/1e6,1)+(lang==='id'?' jt':' M'):a>=1e3?nf(a/1e3)+'k':nf(a))}
function L(l){lang=l;try{localStorage.setItem('rq_l',l)}catch(e){}ui()}
function T(){var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark')}
function ui(){var t=I[lang];document.documentElement.lang=lang;document.title=t.ttl;$('ttl').textContent=t.ttl;$('bi').className=lang==='id'?'on':'';$('be').className=lang==='en'?'on':'';
 $('sb').textContent=t.sb;$('ct').textContent=t.ct;$('cn').textContent=t.cn;$('cp').textContent=t.cp;$('ex').textContent=t.ex;
 var keep={};F.forEach(function(f){var e=$(f[0]);keep[f[0]]=e?e.value:f[1]});
 $('in').innerHTML=F.map(function(f,i){return '<div><label>'+t.f[i][0]+'<input type="number" id="'+f[0]+'" min="0" step="'+f[2]+'" value="'+keep[f[0]]+'" oninput="calc()"></label><small>'+t.f[i][1]+'</small></div>'}).join('');calc()}
function g(i){var v=parseFloat($(i).value);return isFinite(v)&&v>0?v:0}
function net(u,p){var m=p.mg/100,b=p.bp/100,r=p.rd/100,u2=u/100;return p.om*u2*m-p.om*(1+u2)*b*r-p.ot}
function calc(){var t=I[lang],p={};F.forEach(function(f){p[f[0]]=g(f[0])});
 var m=p.mg/100,b=p.bp/100,r=p.rd/100,u=p.up/100,xr=p.om*u,iss=p.om*(1+u)*b,pc=iss*r,xp=xr*m,n=xp-pc-p.ot,cost=pc+p.ot,roi=cost>0?n/cost*100:0,den=m-b*r,be=den>0&&p.om>0?(b*r*p.om+p.ot)/(p.om*den)*100:null;
 last={p:p,xr:xr,iss:iss,pc:pc,xp:xp,n:n,roi:roi,be:be};
 var vals=[rp(xr),nf(iss),rp(pc),rp(xp),rp(n),nf(roi,1)+'%',be===null?'—':nf(be,1)+'%'];
 $('rs').innerHTML=t.r.map(function(l,i){return '<div><span>'+l+'</span><b'+((i===4||i===5)&&n<0?' class="neg"':'')+'>'+vals[i]+'</b></div>'}).join('');
 var vd=$('vd');if(den<=0){vd.className='vd no';vd.textContent=t.neg}else{vd.className='vd '+(n>=0?'ok':'no');vd.textContent=(n>=0?t.ok:t.no)+' '+t.be+nf(be,1)+'%.'}
 var sc=[0,5,10,15,20,30,40],cur=sc.indexOf(Math.round(p.up)),vs=sc.map(function(s){return net(s,p)}),mx=Math.max.apply(null,vs.map(Math.abs).concat([1]));
 $('ch').innerHTML=sc.map(function(s,i){var v=vs[i],h=Math.abs(v)/mx*42;return '<div class="cl'+(cur===i?' cur':'')+'"><span class="v">'+sh(v)+'</span><div class="t"><i class="z" style="top:50%"></i><div class="bar '+(v>=0?'p':'n')+'" style="height:'+h+'%;'+(v>=0?'bottom:50%':'top:50%')+'"></div></div><span class="l">'+s+'%</span></div>'}).join('')}
function cop(){var t=I[lang],L2=last,tx=t.sm+'\n'+t.f.map(function(f,i){var k=F[i][0];return f[0]+': '+nf(L2.p[k],1)}).join('\n')+'\n'+t.r.map(function(l,i){return l+': '+[rp(L2.xr),nf(L2.iss),rp(L2.pc),rp(L2.xp),rp(L2.n),nf(L2.roi,1)+'%',L2.be===null?'—':nf(L2.be,1)+'%'][i]}).join('\n');
 function done(){var b=$('cp'),o=t.cp;b.textContent=t.cd;setTimeout(function(){b.textContent=o},1800)}
 try{navigator.clipboard.writeText(tx).then(done,fb)}catch(e){fb()}
 function fb(){var a=document.createElement('textarea');a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}}
ui();
</script>
</body>
</html>
