<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Qur'an, Hadis, Sholat & Hijriah - Nusachain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F9FF; --top:#E3F0FF; --card:#FFFFFF;
  --p1:#007BFF; --p2:#0056B3; --muted:#6C757D; --chip:#F1F3F5; --tag:#F8F9FA;
  --text:#1B2B3F; --line:#DCE9F7; --ok:#7C9A7E;
  --shadow:0 2px 10px rgba(0,86,179,.08);
  --arab:30px; --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid rgba(0,123,255,.45);outline-offset:2px}

/* ---------- Kerangka: mobile dulu ---------- */
.side{display:none}
.top{background:linear-gradient(180deg,var(--top),var(--bg));padding:calc(12px + env(safe-area-inset-top,0)) 16px 8px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.logo svg{width:24px;height:24px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);box-shadow:0 -2px 14px rgba(0,86,179,.12);padding-bottom:env(safe-area-inset-bottom,0)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav svg{width:22px;height:22px}
.nav.on{color:var(--p2)}
.nav.on svg{color:var(--p1)}
main{padding:6px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0))}
.wrap{max-width:1040px;margin:0 auto}
.col{max-width:820px;margin:0 auto}
.two{display:block}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.field{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--p1)}
.row{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--p2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--p2);flex:none;font-size:22px;line-height:1}
.badge{display:inline-block;background:var(--chip);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;margin-right:4px}
.ar{font-family:'Amiri','Traditional Arabic','Noto Naskh Arabic',serif;direction:rtl}
.hide{display:none!important}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
.state{text-align:center;color:var(--muted);padding:34px 12px}
.state .btn{margin-top:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--p1);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--p2);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}

/* ---------- Al-Qur'an & daftar ---------- */
.last{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;border:0;width:100%;text-align:left}
.last small{color:var(--muted);display:block}
.pill{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.item:hover{background:#FAFCFF}
.num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--top);color:var(--p2);font-weight:800;display:grid;place-items:center;font-size:14px}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:15px}
.item .mid span{font-size:12.5px;color:var(--muted)}
.item .ar{font-size:22px;color:var(--p2)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.bar h2{margin:0;font-size:17px;flex:1;min-width:0}
.bar h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bar h3{margin:0;flex:1;font-size:16px;text-align:center}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:18px;padding:22px 20px;box-shadow:var(--shadow)}
.hero.c{text-align:center}
.hero .ar{font-size:34px;line-height:1.5}
.hero h3{margin:4px 0 2px;font-size:18px}
.hero p{margin:0;font-size:13px;opacity:.9}
.bismillah{font-size:28px;text-align:center;margin:18px 0 6px;color:var(--p2)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--top);border-color:var(--p1);color:var(--p2)}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:1;min-width:200px}
.size input{flex:1;accent-color:var(--p1)}
.ayat{margin-top:12px;scroll-margin-top:12px}
.ayat.hl{outline:2px solid var(--p1)}
.ayat.playing{background:#F0F7FF;outline:2px solid var(--p1)}
.ahead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acts{display:flex;gap:6px}
.sm{border:0;background:var(--tag);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--p2)}
.sm.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.sm.saved{background:var(--ok);color:#fff}
.arab-text{font-size:var(--arab);line-height:2.1;text-align:right}
.latin{color:var(--p2);font-style:italic;font-size:14px;margin:8px 0 0}
.trans{margin:8px 0 0;font-size:15px}
details.tafsir{margin-top:10px;background:var(--tag);border-radius:10px;padding:8px 12px;font-size:14px}
details.tafsir summary{cursor:pointer;font-weight:600;color:var(--p2)}
.hadith-text{font-size:26px;line-height:2.1;text-align:right}
.pager{display:flex;gap:10px;margin-top:16px}
.pager .btn{flex:1}
.books{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.book{border:0;text-align:left;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.book b{display:block;font-size:15px}
.book span{font-size:12.5px;color:var(--muted)}
.book .num{margin-bottom:10px}

/* ---------- Sholat ---------- */
.city{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.city small{display:block;color:var(--muted)}
.link{border:0;background:var(--top);color:var(--p2);font-weight:700;border-radius:999px;padding:7px 14px;font-size:13px}
.results{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.results button{text-align:left;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:11px 14px;font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .nm{font-size:16px;font-weight:700}
.hero .dt{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.times{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.t{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 16px;border:2px solid transparent}
.t span{font-weight:600}
.t b{font-size:18px;font-variant-numeric:tabular-nums}
.t.minor{background:var(--tag);box-shadow:none}
.t.minor span,.t.minor b{color:var(--muted);font-size:14px}
.t.next{border-color:var(--p1);background:#F0F7FF}
.t.next span,.t.next b{color:var(--p2)}
.t.done b{color:var(--muted)}
h3.sec{font-size:15px;margin:22px 0 8px}
.tbl-wrap{overflow-x:auto;border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:440px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--top);color:var(--p2)}
td:first-child,th:first-child{text-align:left;padding-left:12px;white-space:nowrap}
tr.today td{background:#F0F7FF;font-weight:700;color:var(--p2)}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* ---------- Hijriah ---------- */
.hj .big{font-size:30px;font-weight:800;line-height:1.2}
.hj p{margin:4px 0 0;font-size:13.5px;opacity:.92}
.adj{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.adj select{border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.dow.fri{color:var(--ok)}
.cell{aspect-ratio:1/1.05;background:var(--card);border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cell .g{font-weight:700;font-size:15px}
.cell .h{font-size:10.5px;color:var(--muted)}
.cell.empty{background:transparent;box-shadow:none}
.cell.today{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.cell.today .h{color:#fff;opacity:.85}
.cell.ev::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.ev .d{flex:none;width:40px;height:40px;border-radius:12px;background:var(--top);color:var(--p2);font-weight:800;display:grid;place-items:center}
.ev small{display:block;color:var(--muted)}

/* ---------- Tablet ---------- */
@media(min-width:620px){
  .books{grid-template-columns:repeat(3,1fr)}
  .list{grid-template-columns:repeat(2,1fr)}
  main{padding-left:24px;padding-right:24px}
}

/* ---------- Desktop: sidebar kiri, konten lebar ---------- */
@media(min-width:900px){
  body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  .top,.bottom{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--card);box-shadow:2px 0 16px rgba(0,86,179,.08)}
  .side .brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .side .nav{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:auto;padding:12px 14px;border-radius:12px;font-size:14.5px}
  .side .nav:hover{background:var(--bg)}
  .side .nav.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
  .side .nav.on svg{color:#fff}
  .side .src{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 8px;line-height:1.6}
  main{padding:28px 36px 48px}
  .toast{bottom:28px}
  .list{grid-template-columns:repeat(2,1fr)}
  .books{grid-template-columns:repeat(3,1fr)}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start}
  .two.rev{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  h3.sec:first-child{margin-top:0}
  .foot.m{display:none}
}
@media(min-width:1280px){
  .list{grid-template-columns:repeat(3,1fr)}
  .books{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<aside class="side" id="side"></aside>

<div>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg>
      </div>
      <div><h1>Islami Nusachain</h1><p>Al-Qur'an, Hadis, Sholat & Hijriah</p></div>
    </div>
  </header>
  <main><div class="wrap" id="app"></div>
    <div class="foot m">Sumber data: api.quran.gading.dev · hadis-api-id.vercel.app · api.myquran.com</div>
  </main>
</div>

<nav class="bottom" id="bottom" aria-label="Menu utama"></nav>
<div class="toast" id="toast" role="status"></div>
<audio id="player" preload="none"></audio>

<script>
const Q_API = 'https://api.quran.gading.dev';
const H_API = 'https://api.hadith.gading.dev'; // cadangan
const H2_API = 'https://hadis-api-id.vercel.app'; // sumber utama hadis
const H2_SLUG = {'abu-daud':'abu-dawud'}; // slug internal (gading) -> slug hadis-api-id
const H2_BACK = {'abu-dawud':'abu-daud'};
const M_API = 'https://api.myquran.com/v2';
const PAGE = 20;
let HADITH_BOOKS = [];
const HADITH_FALLBACK = [
  {id:'bukhari',name:'HR. Bukhari',available:6638},{id:'muslim',name:'HR. Muslim',available:4930},
  {id:'abu-daud',name:'HR. Abu Daud',available:4419},{id:'tirmidzi',name:'HR. Tirmidzi',available:3625},
  {id:'nasai',name:"HR. Nasa'i",available:5364},{id:'ibnu-majah',name:'HR. Ibnu Majah',available:4285},
  {id:'ahmad',name:'HR. Ahmad',available:4305},{id:'darimi',name:'HR. Darimi',available:2949},
  {id:'malik',name:'Muwatha Malik',available:1587}
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ni_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ni_'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Jaringan: batas waktu, coba ulang, pesan error jelas ---------- */
const cache = {};
let lastErr = '';
async function api(url, raw, ms){
  if(cache[url]) return cache[url];
  let err;
  for(let i = 0; i < 2; i++){
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), ms || 20000);
    try{
      const r = await fetch(url, {signal: ctl.signal});
      clearTimeout(tm);
      if(!r.ok) throw new Error('Server membalas HTTP ' + r.status);
      const j = await r.json();
      if(raw){ cache[url] = j; return j; }
      if(j.status === false) throw new Error(j.message || 'API menolak permintaan');
      if(j.data === undefined || j.data === null) throw new Error('Respons tidak berisi data (' + (j.message || 'tanpa pesan') + ')');
      cache[url] = j.data;
      return j.data;
    }catch(e){
      clearTimeout(tm);
      err = e.name === 'AbortError' ? new Error('Server tidak merespons (waktu habis ' + ((ms || 20000) / 1000) + ' detik)')
          : (e instanceof TypeError ? new Error('Permintaan diblokir atau tidak ada koneksi ke ' + new URL(url).host) : e);
      await new Promise(res => setTimeout(res, 800));
    }
  }
  lastErr = err.message;
  throw err;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
function loading(){ $('#app').innerHTML = '<div class="state"><div class="spin"></div>Memuat…</div>'; }
function failed(retry, testUrl){
  $('#app').innerHTML = `<div class="state"><b>Data tidak bisa dimuat</b><br>${esc(lastErr || 'Periksa koneksi internet lalu coba lagi.')}<br>
    <button class="btn" onclick="${retry}">Coba lagi</button>
    ${testUrl ? `<br><a href="${esc(testUrl)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:12px;color:var(--p2);font-weight:600;font-size:13px">Tes alamat API di browser</a>` : ''}</div>`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Tersalin'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Tersalin'); }catch(_){ toast('Gagal menyalin'); }
    ta.remove();
  }
}

const ICON = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',
  mark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'
};
const S_ = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const NAV = [
  {id:'quran', label:"Al-Qur'an", svg:`<svg viewBox="0 0 24 24" ${S_}><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg>`},
  {id:'hadis', label:'Hadis', svg:`<svg viewBox="0 0 24 24" ${S_}><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>`},
  {id:'sholat', label:'Sholat', svg:`<svg viewBox="0 0 24 24" ${S_}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`},
  {id:'hijriah', label:'Hijriah', svg:`<svg viewBox="0 0 24 24" ${S_}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`}
];
function buildNav(){
  const links = NAV.map(n => `<a class="nav" data-s="${n.id}" href="#${n.id}">${n.svg}<span>${n.label}</span></a>`).join('');
  $('#bottom').innerHTML = links;
  $('#side').innerHTML = `
    <div class="brand"><div class="logo" aria-hidden="true">${NAV[0].svg.replace('currentColor','#fff').replace('currentColor','#fff')}</div>
      <div><h1>Islami Nusachain</h1><p>Mobile DApp</p></div></div>
    ${links}
    <div class="src">Sumber data:<br>api.quran.gading.dev<br>hadis-api-id.vercel.app<br>api.myquran.com</div>`;
}
function setNav(sec){ document.querySelectorAll('.nav').forEach(a => a.classList.toggle('on', a.dataset.s === sec)); }

/* ---------- Router ---------- */
let RT = 0; // penanda navigasi: hasil async lama diabaikan bila pengguna sudah pindah halaman
function go(h){ location.hash = h; }
function route(){
  RT++;
  const parts = (location.hash.replace('#', '') || 'quran').split('/');
  const sec = ['quran','hadis','sholat','hijriah'].includes(parts[0]) ? parts[0] : 'quran';
  const a = parts[1], b = parts[2];
  setNav(sec); stopAudio(); window.scrollTo(0, 0);
  if(sec === 'hadis') a ? hadithBook(a, parseInt(b) || 1) : hadithHome();
  else if(sec === 'sholat') initSholat();
  else if(sec === 'hijriah') renderHijriah();
  else a ? surahDetail(parseInt(a), parseInt(b) || 0) : quranHome();
}
window.addEventListener('hashchange', route);

/* ================= AL-QUR'AN ================= */
let surahs = [];
async function quranHome(){
  const my = RT; loading();
  try{ surahs = await api(Q_API + '/surah'); }catch(e){ if(my === RT) failed('quranHome()', Q_API + '/surah'); return; }
  if(my !== RT) return;
  const last = store.get('last', null);
  $('#app').innerHTML = `
    <input class="field" id="q" type="search" placeholder="Cari surah (nama atau nomor)" autocomplete="off">
    ${last ? `<button class="card last" onclick="go('quran/${last.s}/${last.v}')"><span><small>Terakhir dibaca</small><b>${esc(last.name)}, ayat ${last.v}</b></span><span class="pill">Lanjutkan</span></button>` : ''}
    <div class="list" id="slist"></div>`;
  const draw = () => {
    const k = $('#q').value.trim().toLowerCase();
    const rows = surahs.filter(s => !k || String(s.number) === k ||
      s.name.transliteration.id.toLowerCase().includes(k) ||
      s.name.translation.id.toLowerCase().includes(k));
    $('#slist').innerHTML = rows.length ? rows.map(s => `
      <button class="item" onclick="go('quran/${s.number}')">
        <span class="num">${s.number}</span>
        <span class="mid"><b>${esc(s.name.transliteration.id)}</b>
          <span>${esc(s.name.translation.id)}</span><br>
          <span class="badge">${esc(s.revelation.id)}</span><span class="badge">${s.numberOfVerses} ayat</span></span>
        <span class="ar">${esc(s.name.short)}</span>
      </button>`).join('') : '<div class="state" style="grid-column:1/-1">Surah tidak ditemukan.</div>';
  };
  $('#q').addEventListener('input', draw); draw();
}

const prefs = Object.assign({latin:true, trans:true, tafsir:false, size:30, auto:true}, store.get('prefs', {}));
let cur = null, playing = null;

async function surahDetail(n, focus){
  if(!(n >= 1 && n <= 114)) return go('quran');
  const my = RT; loading();
  try{ cur = await api(`${Q_API}/surah/${n}`); }catch(e){ if(my === RT) failed(`surahDetail(${n},${focus})`, `${Q_API}/surah/${n}`); return; }
  if(my !== RT) return;
  const s = cur;
  const bism = s.preBismillah ? `<div class="ar bismillah">${esc(s.preBismillah.text.arab)}</div>` : '';
  $('#app').innerHTML = `<div class="col">
    <div class="bar">
      <button class="icon-btn" aria-label="Kembali" onclick="go('quran')">${ICON.back}</button>
      <h2>${esc(s.name.transliteration.id)}<small>${esc(s.name.translation.id)} · ${s.numberOfVerses} ayat · ${esc(s.revelation.id)}</small></h2>
    </div>
    <div class="hero c"><div class="ar">${esc(s.name.long)}</div><h3>${esc(s.name.transliteration.id)}</h3><p>${esc(s.name.translation.id)}</p></div>
    <div class="opts" id="opts">
      <button class="chip" data-k="latin">Latin</button>
      <button class="chip" data-k="trans">Terjemahan</button>
      <button class="chip" data-k="tafsir">Tafsir</button>
      <button class="chip" data-k="auto">Putar berurutan</button>
      <label class="size">Ukuran Arab <input type="range" id="size" min="22" max="48" value="${prefs.size}"></label>
    </div>
    ${bism}
    <div id="verses"></div>
    <div class="pager">
      <button class="btn ghost" ${n===1?'disabled':''} onclick="go('quran/${n-1}')">Surah sebelumnya</button>
      <button class="btn" ${n===114?'disabled':''} onclick="go('quran/${n+1}')">Surah berikutnya</button>
    </div></div>`;
  document.documentElement.style.setProperty('--arab', prefs.size + 'px');
  $('#size').addEventListener('input', e => { prefs.size = +e.target.value; document.documentElement.style.setProperty('--arab', prefs.size + 'px'); store.set('prefs', prefs); });
  $('#opts').addEventListener('click', e => {
    const k = e.target.dataset.k; if(!k) return;
    prefs[k] = !prefs[k]; store.set('prefs', prefs); syncChips(); drawVerses();
  });
  syncChips(); drawVerses();
  if(focus){
    const el = document.getElementById('v' + focus);
    if(el){ el.classList.add('hl'); el.scrollIntoView({block:'start'}); }
  }
}
function syncChips(){ document.querySelectorAll('#opts .chip').forEach(c => c.classList.toggle('on', !!prefs[c.dataset.k])); }

function drawVerses(){
  const last = store.get('last', null);
  $('#verses').innerHTML = cur.verses.map((v, i) => {
    const no = v.number.inSurah;
    const saved = last && last.s === cur.number && last.v === no;
    const tf = v.tafsir && v.tafsir.id ? (v.tafsir.id.long || v.tafsir.id.short) : '';
    return `
    <article class="card ayat" id="v${no}">
      <div class="ahead">
        <span class="num">${no}</span>
        <div class="acts">
          <button class="sm" id="pb${i}" aria-label="Putar ayat ${no}" onclick="playVerse(${i})">${ICON.play}</button>
          <button class="sm" aria-label="Salin ayat ${no}" onclick="copyVerse(${i})">${ICON.copy}</button>
          <button class="sm ${saved?'saved':''}" aria-label="Tandai terakhir dibaca" onclick="markVerse(${i})">${ICON.mark}</button>
        </div>
      </div>
      <div class="ar arab-text">${esc(v.text.arab)}</div>
      ${prefs.latin ? `<p class="latin">${esc(v.text.transliteration.en)}</p>` : ''}
      ${prefs.trans ? `<p class="trans">${esc(v.translation.id)}</p>` : ''}
      ${prefs.tafsir && tf ? `<details class="tafsir"><summary>Tafsir ayat ${no}</summary><p>${esc(tf)}</p></details>` : ''}
    </article>`;
  }).join('');
  if(playing !== null) markPlaying(playing, true);
}

const player = $('#player');
function playVerse(i){
  if(playing === i && !player.paused){ player.pause(); markPlaying(i, false); return; }
  const v = cur.verses[i];
  if(playing !== null) markPlaying(playing, false);
  playing = i;
  player.src = v.audio.primary;
  player.play().then(() => markPlaying(i, true)).catch(() => { playing = null; toast('Audio tidak bisa diputar'); });
}
function markPlaying(i, on){
  const b = document.getElementById('pb' + i); if(!b) return;
  const a = b.closest('.ayat');
  b.innerHTML = on ? ICON.pause : ICON.play; b.classList.toggle('on', on);
  a.classList.toggle('playing', on);
  if(on) a.scrollIntoView({block:'center', behavior:'smooth'});
}
player.addEventListener('ended', () => {
  const i = playing; markPlaying(i, false);
  if(prefs.auto && cur && i + 1 < cur.verses.length) playVerse(i + 1); else playing = null;
});
function stopAudio(){ try{ player.pause(); }catch(e){} playing = null; }
function copyVerse(i){
  const v = cur.verses[i];
  copyText(`${v.text.arab}\n\n${v.translation.id}\n\n(QS. ${cur.name.transliteration.id}: ${v.number.inSurah})`);
}
function markVerse(i){
  const v = cur.verses[i];
  store.set('last', {s:cur.number, v:v.number.inSurah, name:cur.name.transliteration.id});
  drawVerses(); toast('Ditandai sebagai terakhir dibaca');
}

/* ================= HADIS ================= */
async function hadithHome(){
  const my = RT; loading();
  let books;
  try{
    const l = await api(H2_API + '/hadith', true, 8000);
    if(!Array.isArray(l) || !l.length) throw new Error('Daftar perawi kosong');
    const ord = id => { const i = HADITH_FALLBACK.findIndex(b => b.id === id); return i < 0 ? 99 : i; };
    books = l.map(b => { const id = H2_BACK[b.slug] || b.slug; return {id, name: (HADITH_FALLBACK.find(x => x.id === id) || {}).name || ('HR. ' + b.name), available: b.total}; })
             .sort((a, b) => ord(a.id) - ord(b.id));
  }catch(e){
    try{ books = await api(H_API + '/books'); }catch(e2){ books = HADITH_FALLBACK; }
  }
  if(my !== RT) return;
  HADITH_BOOKS = books;
  $('#app').innerHTML = `
    <div class="card" style="margin-top:12px"><b>Kitab Hadis</b><br><span style="font-size:13px;color:var(--muted)">Pilih kitab untuk mulai membaca. Teks Arab dengan terjemahan Indonesia.</span></div>
    <div class="books">${books.map((b, i) => `
      <button class="book" onclick="go('hadis/${esc(b.id)}')">
        <span class="num">${i + 1}</span><b>${esc(b.name)}</b><span>${Number(b.available).toLocaleString('id-ID')} hadis</span>
      </button>`).join('')}</div>`;
}

async function hadithBook(id, start){
  const my = RT; loading();
  start = Math.max(1, start);
  start = Math.floor((start - 1) / PAGE) * PAGE + 1;
  const goto = parseInt(location.hash.split('/')[2]) || 0;
  const known = (HADITH_BOOKS.find(b => b.id === id) || {}).available;
  const rEnd = known ? Math.min(start + PAGE - 1, known) : start + PAGE - 1;
  const page = Math.floor((start - 1) / PAGE) + 1;
  let url = `${H2_API}/hadith/${encodeURIComponent(H2_SLUG[id] || id)}?page=${page}&limit=${PAGE}`;
  let d, list, total;
  try{
    const j = await api(url, true, 8000);
    if(!j || !Array.isArray(j.items)) throw new Error('Format respons tidak dikenal');
    list = j.items;
    total = j.total || (j.pagination || {}).totalItems || list.length;
    d = {name: (HADITH_FALLBACK.find(b => b.id === id) || {}).name || ('HR. ' + j.name)};
  }catch(e){
    url = `${H_API}/books/${encodeURIComponent(id)}?range=${start}-${rEnd}`;
    try{
      const g = await api(url);
      list = g.contents || g.hadiths || [];
      total = g.available || list.length;
      d = {name: g.name};
    }catch(e2){ if(my === RT) failed(`hadithBook('${id}',${start})`, url); return; }
  }
  if(my !== RT) return;
  const end = Math.min(start + PAGE - 1, total);
  $('#app').innerHTML = `<div class="col">
    <div class="bar">
      <button class="icon-btn" aria-label="Kembali" onclick="go('hadis')">${ICON.back}</button>
      <h2>${esc(d.name)}<small>Hadis ${start}–${end} dari ${Number(total).toLocaleString('id-ID')}</small></h2>
    </div>
    <div class="row">
      <input class="field" id="hq" type="search" placeholder="Cari di halaman ini" autocomplete="off">
      <input class="field" id="hn" type="number" min="1" max="${total}" placeholder="No." style="width:92px" inputmode="numeric">
    </div>
    <div id="hlist"></div>
    <div class="pager">
      <button class="btn ghost" ${start<=1?'disabled':''} onclick="go('hadis/${esc(id)}/${Math.max(1,start-PAGE)}')">Sebelumnya</button>
      <button class="btn" ${end>=total?'disabled':''} onclick="go('hadis/${esc(id)}/${start+PAGE}')">Berikutnya</button>
    </div></div>`;
  const draw = () => {
    const k = $('#hq').value.trim().toLowerCase();
    const rows = list.filter(h => !k || String(h.id).toLowerCase().includes(k) || String(h.number) === k);
    $('#hlist').innerHTML = rows.length ? rows.map(h => `
      <article class="card ayat" id="h${h.number}">
        <div class="ahead"><span class="badge" style="font-size:12.5px">${esc(d.name)} No. ${h.number}</span>
          <div class="acts"><button class="sm" aria-label="Salin hadis ${h.number}" data-n="${h.number}">${ICON.copy}</button></div></div>
        <div class="ar hadith-text">${esc(h.arab)}</div>
        <p class="trans">${esc(h.id)}</p>
      </article>`).join('') : '<div class="state">Tidak ada hadis yang cocok di halaman ini.</div>';
  };
  draw();
  $('#hq').addEventListener('input', draw);
  $('#hlist').addEventListener('click', e => {
    const b = e.target.closest('button[data-n]'); if(!b) return;
    const h = list.find(x => String(x.number) === b.dataset.n);
    if(h) copyText(`${h.arab}\n\n${h.id}\n\n(${d.name} No. ${h.number})`);
  });
  $('#hn').addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const n = parseInt(e.target.value);
    if(n >= 1 && n <= total) go(`hadis/${id}/${n}`); else toast('Nomor hadis tidak valid');
  });
  if(goto && goto !== start){ const el = document.getElementById('h' + goto); if(el){ el.classList.add('hl'); el.scrollIntoView({block:'start'}); } }
}

/* ================= TANGGAL ================= */
const HARI = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN_H = ['Muharram','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab','Syaban','Ramadan','Syawal','Dzulqaidah','Dzulhijjah'];
const EVENTS = [
  [1,1,'Tahun Baru Hijriah'],[1,10,'Hari Asyura'],[3,12,'Maulid Nabi Muhammad'],
  [7,27,"Isra Mi'raj"],[8,15,'Nisfu Syaban'],[9,1,'Awal Ramadan'],[9,17,"Nuzulul Qur'an"],
  [10,1,'Idul Fitri'],[12,9,'Hari Arafah'],[12,10,'Idul Adha']
];
let adj = store.get('adj', 0);
const fmtH = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {day:'numeric', month:'numeric', year:'numeric'});
function hijri(date, a = adj){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate() + a, 12);
  const p = {}; fmtH.formatToParts(d).forEach(x => { if(x.type !== 'literal') p[x.type] = parseInt(x.value); });
  return {d:p.day, m:p.month, y:p.year};
}
const hText = h => `${h.d} ${BLN_H[h.m-1]} ${h.y} H`;
const fmtG = d => `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
const eventOf = h => { const e = EVENTS.find(x => x[0] === h.m && x[1] === h.d); return e ? e[2] : null; };

/* ================= HIJRIAH ================= */
let viewDate = new Date(); viewDate.setDate(1);
function renderHijriah(){
  const today = new Date(), ht = hijri(today);
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for(let i = 0; i < first; i++) cells += '<div class="cell empty"></div>';
  const evs = [];
  for(let d = 1; d <= days; d++){
    const dt = new Date(y, m, d), h = hijri(dt), ev = eventOf(h);
    if(ev) evs.push({g:d, h, name:ev});
    cells += `<div class="cell ${ymd(dt) === ymd(today) ? 'today' : ''} ${ev ? 'ev' : ''}"><span class="g">${d}</span><span class="h">${h.d}</span></div>`;
  }
  $('#app').innerHTML = `
    <div class="two rev" style="margin-top:12px">
      <div>
        <div class="hero c hj">
          <small>Hari ini</small>
          <div class="big">${esc(hText(ht))}</div>
          <p>${esc(fmtG(today))}</p>
          <p id="myq" class="hide"></p>
        </div>
        <div class="adj"><span>Koreksi tanggal (sesuaikan dengan penetapan Kemenag)</span>
          <select id="adjsel" aria-label="Koreksi tanggal Hijriah">
            ${[-2,-1,0,1,2].map(v => `<option value="${v}" ${v===adj?'selected':''}>${v>0?'+':''}${v} hari</option>`).join('')}
          </select></div>
        <div class="bar">
          <button class="icon-btn" aria-label="Bulan sebelumnya" onclick="moveMonth(-1)">&#8249;</button>
          <h3>${BULAN[m]} ${y}</h3>
          <button class="icon-btn" aria-label="Bulan berikutnya" onclick="moveMonth(1)">&#8250;</button>
        </div>
        <div class="grid">
          ${HARI.map((h, i) => `<div class="dow ${i===5?'fri':''}">${h.slice(0,3)}</div>`).join('')}
          ${cells}
        </div>
      </div>
      <div>
        <h3 class="sec">Hari besar Islam bulan ini</h3>
        <div class="ev-list">${evs.length ? evs.map(e => `
          <div class="ev"><span class="d">${e.g}</span><div><b>${esc(e.name)}</b><small>${esc(hText(e.h))}</small></div></div>`).join('')
          : '<div class="state">Tidak ada hari besar di bulan ini.</div>'}</div>
        <p class="note">Angka kecil di tiap tanggal adalah tanggal Hijriah. Titik hijau menandai hari besar. Tanggal bisa berbeda satu hari dari penetapan resmi pemerintah.</p>
      </div>
    </div>`;
  $('#adjsel').addEventListener('change', e => { adj = +e.target.value; store.set('adj', adj); renderHijriah(); });
  myquranHijri(today);
}
function moveMonth(n){ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + n, 1); renderHijriah(); }
async function myquranHijri(today){
  const my = RT;
  try{
    const d = await api(`${M_API}/cal/hijr/${ymd(today)}?adj=${adj}`);
    const arr = Array.isArray(d && d.date) ? d.date : [];
    const s = arr.find(x => typeof x === 'string' && /\d{4}/.test(x) && /[A-Za-z]/.test(x) && x.length < 40);
    const el = $('#myq');
    if(my === RT && s && el){ el.textContent = 'Menurut myquran: ' + s; el.classList.remove('hide'); }
  }catch(e){ /* hitungan lokal tetap tampil */ }
}

/* ================= SHOLAT ================= */
const DEFAULT_CITY = {id:'1301', lokasi:'Kota Jakarta'};
let city = store.get('city', DEFAULT_CITY);
let S = {today:null, tomorrow:null, date:'', mY:0, mM:0};
const MAIN = [['subuh','Subuh'],['dzuhur','Dzuhur'],['ashar','Ashar'],['maghrib','Maghrib'],['isya','Isya']];
const MINOR = [['imsak','Imsak'],['terbit','Terbit'],['dhuha','Dhuha']];
const loadMonth = (id, y, m) => api(`${M_API}/sholat/jadwal/${id}/${y}/${pad(m)}`);
async function rowFor(date){
  const d = await loadMonth(city.id, date.getFullYear(), date.getMonth() + 1);
  return {info:d, row:(d.jadwal || []).find(r => r.date === ymd(date))};
}

async function initSholat(){
  const my = RT, now = new Date();
  S.mY = now.getFullYear(); S.mM = now.getMonth() + 1; S.date = ymd(now);
  $('#app').innerHTML = '<div class="state"><div class="spin"></div>Memuat jadwal…</div>';
  try{
    const t = await rowFor(now);
    const tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const nx = await rowFor(tm).catch(() => null);
    if(!t.row) throw new Error('Jadwal untuk hari ini tidak ditemukan');
    if(my !== RT) return;
    S.today = t; S.tomorrow = nx && nx.row ? nx.row : null;
    city.lokasi = t.info.lokasi || city.lokasi; store.set('city', city);
    drawSholat(); drawMonth(); tick();
  }catch(e){
    if(my !== RT) return;
    S.today = null;
    lastErr = e.message || lastErr;
    $('#app').innerHTML = `<div class="state"><b>Jadwal tidak bisa dimuat</b><br>${esc(lastErr)}<br>Periksa koneksi internet atau pilih kota lain.<br>
      <button class="btn" onclick="initSholat()">Coba lagi</button> <button class="btn ghost" onclick="openSearch()">Ganti kota</button></div>`;
  }
}

function drawSholat(){
  const r = S.today.row, info = S.today.info, now = new Date(), h = hijri(now);
  const line = (k, n, cls = '') => `<div class="t ${cls}" id="t-${k}"><span>${n}</span><b>${esc(r[k])}</b></div>`;
  $('#app').innerHTML = `
    <div class="two">
      <div>
        <div class="city">
          <div><b>${esc(info.lokasi)}</b><small>${esc(info.daerah || '')}</small></div>
          <button class="link" onclick="openSearch()">Ganti kota</button>
        </div>
        <div id="search" class="hide" style="margin-bottom:12px">
          <input class="field" id="cq" type="search" placeholder="Ketik nama kota atau kabupaten (min. 3 huruf)" autocomplete="off">
          <div class="results" id="cres"></div>
        </div>
        <div class="hero">
          <small>Sholat berikutnya</small>
          <div class="nm" id="nname">-</div>
          <div class="big" id="ncount">--:--:--</div>
          <div class="dt"><span>${esc(fmtG(now))}</span><span>${esc(hText(h))}</span></div>
        </div>
        <div class="times">
          ${line('imsak','Imsak','minor')}${line('subuh','Subuh')}${line('terbit','Terbit','minor')}${line('dhuha','Dhuha','minor')}
          ${line('dzuhur','Dzuhur')}${line('ashar','Ashar')}${line('maghrib','Maghrib')}${line('isya','Isya')}
        </div>
      </div>
      <div>
        <h3 class="sec">Jadwal sebulan</h3>
        <div class="bar" style="margin-top:0">
          <button class="icon-btn" aria-label="Bulan sebelumnya" onclick="monthMove(-1)">&#8249;</button>
          <h3 id="mtitle"></h3>
          <button class="icon-btn" aria-label="Bulan berikutnya" onclick="monthMove(1)">&#8250;</button>
        </div>
        <div class="tbl-wrap" id="mtable"></div>
        <p class="note">Waktu mengikuti zona waktu perangkat. Pastikan sama dengan zona waktu kota yang dipilih (WIB, WITA, atau WIT).</p>
      </div>
    </div>`;
  let tmr;
  $('#cq').addEventListener('input', e => {
    clearTimeout(tmr); const q = e.target.value.trim();
    if(q.length < 3){ $('#cres').innerHTML = ''; return; }
    tmr = setTimeout(() => searchCity(q), 400);
  });
}
function openSearch(){
  if(!$('#search')){ initSholat().then(() => { if($('#search')) openSearch(); }); return; }
  $('#search').classList.toggle('hide'); const i = $('#cq'); if(i) i.focus();
}
async function searchCity(q){
  const box = $('#cres'); box.innerHTML = '<div class="state" style="padding:12px">Mencari…</div>';
  try{
    const list = await api(`${M_API}/sholat/kota/cari/` + encodeURIComponent(q.toLowerCase()));
    if(!$('#cres')) return;
    box.innerHTML = (list && list.length)
      ? list.map(c => `<button data-id="${esc(c.id)}" data-n="${esc(c.lokasi)}">${esc(c.lokasi)}</button>`).join('')
      : '<div class="state" style="padding:12px">Kota tidak ditemukan.</div>';
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      city = {id:b.dataset.id, lokasi:b.dataset.n}; store.set('city', city); initSholat();
    });
  }catch(e){ if($('#cres')) $('#cres').innerHTML = '<div class="state" style="padding:12px">Pencarian gagal. Coba lagi.</div>'; }
}

const at = (row, key, base) => {
  const [h, m] = String(row[key]).split(':').map(Number);
  return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0);
};
function tick(){
  if(!S.today || !$('#nname')) return;
  const now = new Date();
  if(ymd(now) !== S.date){ initSholat(); return; }
  const row = S.today.row;
  let next = null;
  for(const [k, n] of MAIN){ const t = at(row, k, now); if(t > now){ next = {k, n, t}; break; } }
  if(!next){
    const tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    next = S.tomorrow ? {k:null, n:'Subuh (besok)', t:at(S.tomorrow, 'subuh', tm)} : null;
  }
  MAIN.concat(MINOR).forEach(([k]) => {
    const el = document.getElementById('t-' + k); if(!el) return;
    el.classList.toggle('next', !!next && next.k === k);
    el.classList.toggle('done', at(row, k, now) <= now && !(next && next.k === k));
  });
  if(!next){ $('#nname').textContent = 'Jadwal besok belum tersedia'; $('#ncount').textContent = '--:--:--'; return; }
  const sec = Math.max(0, Math.floor((next.t - now) / 1000));
  $('#nname').textContent = `${next.n} pukul ${next.k ? row[next.k] : S.tomorrow.subuh}`;
  $('#ncount').textContent = `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;
}
setInterval(tick, 1000);

async function drawMonth(){
  const box = $('#mtable'); if(!box) return;
  const my = RT;
  $('#mtitle').textContent = `${BULAN[S.mM-1]} ${S.mY}`;
  box.innerHTML = '<div class="state"><div class="spin"></div></div>';
  try{
    const d = await loadMonth(city.id, S.mY, S.mM);
    if(my !== RT || !$('#mtable')) return;
    const todayStr = ymd(new Date());
    box.innerHTML = `<table><thead><tr><th>Tanggal</th><th>Imsak</th><th>Subuh</th><th>Dzuhur</th><th>Ashar</th><th>Maghrib</th><th>Isya</th></tr></thead><tbody>
      ${(d.jadwal || []).map(r => `<tr class="${r.date === todayStr ? 'today' : ''}">
        <td>${esc(String(r.tanggal).replace(/^[A-Za-z]+,\s*/, ''))}</td><td>${esc(r.imsak)}</td><td>${esc(r.subuh)}</td><td>${esc(r.dzuhur)}</td><td>${esc(r.ashar)}</td><td>${esc(r.maghrib)}</td><td>${esc(r.isya)}</td></tr>`).join('')}
      </tbody></table>`;
  }catch(e){ if($('#mtable')) $('#mtable').innerHTML = '<div class="state">Jadwal bulan ini tidak bisa dimuat.</div>'; }
}
function monthMove(n){
  let m = S.mM + n, y = S.mY;
  if(m < 1){ m = 12; y--; } if(m > 12){ m = 1; y++; }
  S.mM = m; S.mY = y; drawMonth();
}

/* ---------- Mulai ---------- */
buildNav();
route();
</script>
