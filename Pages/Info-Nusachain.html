<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gempa & Cuaca - Nusachain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F9FF; --top:#E3F0FF; --card:#FFFFFF;
  --p1:#007BFF; --p2:#0056B3; --muted:#6C757D; --chip:#F1F3F5; --tag:#F8F9FA;
  --text:#1B2B3F; --line:#DCE9F7; --ok:#7C9A7E; --warn:#D9A441; --bad:#D9534F;
  --shadow:0 2px 10px rgba(0,86,179,.08); --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid rgba(0,123,255,.45);outline-offset:2px}

.side{display:none}
.top{background:linear-gradient(180deg,var(--top),var(--bg));padding:calc(12px + env(safe-area-inset-top,0)) 16px 8px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.logo svg{width:24px;height:24px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);box-shadow:0 -2px 14px rgba(0,86,179,.12);padding-bottom:env(safe-area-inset-bottom,0)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav svg{width:22px;height:22px}
.nav.on{color:var(--p2)}
.nav.on svg{color:var(--p1)}
main{padding:6px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0))}
.wrap{max-width:1040px;margin:0 auto}
.two{display:block}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.field,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
.field:focus,select:focus{border-color:var(--p1)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:var(--shadow)}
.btn.ghost{background:var(--card);color:var(--p2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--p2);flex:none;font-size:20px;line-height:1}
.hide{display:none!important}
.sp{height:12px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:28px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.state{text-align:center;color:var(--muted);padding:34px 12px}
.state .btn{margin-top:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--p1);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--p2);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}
.bar h2{margin:0;font-size:17px;flex:1;min-width:0}
.bar h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
h3.sec{font-size:15px;margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--top);border-color:var(--p1);color:var(--p2)}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:18px;padding:22px 20px;box-shadow:var(--shadow)}
.hero small{opacity:.9;font-size:13px}
.hero .dt{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;background:var(--chip);color:var(--muted);border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;margin:2px 4px 2px 0}

/* Gempa */
.mag{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--muted)}
.mag.m1{background:var(--ok)} .mag.m2{background:var(--warn)} .mag.m3{background:var(--bad)}
.eq-hero{display:flex;gap:16px;align-items:center}
.eq-hero .bigm{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.02em}
.eq-hero .wil{font-size:16px;font-weight:700;line-height:1.35}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.kv div{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:11.5px}
.kv b{font-size:14px}
.kv .full{grid-column:1/-1}
.shake{width:100%;border-radius:14px;box-shadow:var(--shadow);background:var(--card);display:block}
.list{display:grid;grid-template-columns:1fr;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;text-decoration:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:14.5px;line-height:1.35}
.item .mid span{font-size:12.5px;color:var(--muted)}
button.item:hover,a.item:hover{background:#FAFCFF}
.link{color:var(--p2);font-weight:700;font-size:13px}

/* Cuaca */
.wx-now{display:flex;align-items:center;gap:16px}
.wx-now .ico{font-size:64px;line-height:1}
.wx-now .t{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
.wx-now .d{font-size:15px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;font-size:12px}
.stats b{display:block;font-size:15px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.hr{flex:none;width:76px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center}
.hr small{display:block;color:var(--muted);font-size:12px}
.hr .e{font-size:26px;margin:4px 0}
.hr b{font-size:15px}
.hr.cur{outline:2px solid var(--p1)}
details.day{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
details.day summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
details.day summary::-webkit-details-marker{display:none}
details.day .e{font-size:28px}
details.day .s{flex:1;min-width:0}
details.day .s b{display:block;font-size:14.5px}
details.day .s span{font-size:12.5px;color:var(--muted)}
details.day .r{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:420px}
th,td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--top);color:var(--p2)}
td:first-child,th:first-child{text-align:left;padding-left:12px}
td.l{text-align:left}
.picker{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
details.pick{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px 14px;margin:12px 0}
details.pick summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--p2)}
details.pick .picker{padding-bottom:14px}

/* Wilayah */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin:12px 0}
.crumbs a{text-decoration:none;color:var(--p2);font-weight:600;background:var(--top);border-radius:999px;padding:4px 12px}
.crumbs span{color:var(--muted)}
.num{flex:none;min-width:44px;height:36px;padding:0 8px;border-radius:10px;background:var(--top);color:var(--p2);font-weight:800;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.codebox{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin:12px 0;font-size:13.5px}

@media(min-width:620px){
  .list{grid-template-columns:repeat(2,1fr)}
  main{padding-left:24px;padding-right:24px}
  .picker{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:900px){
  body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  .top,.bottom{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--card);box-shadow:2px 0 16px rgba(0,86,179,.08)}
  .side .brand{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .side .nav{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:auto;padding:12px 14px;border-radius:12px;font-size:14.5px}
  .side .nav:hover{background:var(--bg)}
  .side .nav.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
  .side .nav.on svg{color:#fff}
  .side .src{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 8px;line-height:1.6}
  main{padding:28px 36px 48px}
  .toast{bottom:28px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .picker{grid-template-columns:repeat(4,1fr)}
  .foot.m{display:none}
  h3.sec:first-child{margin-top:0}
}
@media(min-width:1280px){ .list.w{grid-template-columns:repeat(3,1fr)} }
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div>
  <header class="top"><div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></div>
    <div><h1>Info Nusachain</h1><p>Gempa & Cuaca</p></div>
  </div></header>
  <main><div class="wrap" id="app"></div>
    <div class="foot m">Sumber data: BMKG · Emsifa (daftar wilayah)</div>
  </main>
</div>
<nav class="bottom" id="bottom" aria-label="Menu utama"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
const BMKG_EQ = 'https://data.bmkg.go.id/DataMKG/TEWS/';
const BMKG_WX = 'https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=';
const WIL = 'https://emsifa.github.io/api-wilayah-indonesia/api/';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d){ try{ const v = localStorage.getItem('ng_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ng_'+k, JSON.stringify(v)); }catch(e){} }
};
const HARI = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const title = s => String(s).toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g, (m, a, b) => a + b.toUpperCase())
  .replace(/\bDki\b/g,'DKI').replace(/\bDi\b/g,'DI').replace(/\bKab\./g,'Kab.');

/* ---------- Jaringan: cache TTL, batas waktu, coba ulang, pesan error jelas ---------- */
const cache = {};
let lastErr = '';
async function getJson(url, ttl = 600000){
  const c = cache[url];
  if(c && Date.now() - c.t < ttl) return c.v;
  let err;
  for(let i = 0; i < 2; i++){
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 20000);
    try{
      const r = await fetch(url, {signal: ctl.signal});
      clearTimeout(tm);
      if(!r.ok) throw new Error('Server membalas HTTP ' + r.status);
      const v = await r.json();
      cache[url] = {t:Date.now(), v};
      return v;
    }catch(e){
      clearTimeout(tm);
      err = e.name === 'AbortError' ? new Error('Server tidak merespons (waktu habis 20 detik)')
          : (e instanceof TypeError ? new Error('Permintaan diblokir (kemungkinan CORS) atau tidak ada koneksi ke ' + new URL(url).host) : e);
      await new Promise(res => setTimeout(res, 700));
    }
  }
  lastErr = err.message; throw err;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
function loading(){ $('#app').innerHTML = '<div class="state"><div class="spin"></div>Memuat…</div>'; }
function failed(retry, testUrl){
  $('#app').innerHTML = `<div class="state"><b>Data tidak bisa dimuat</b><br>${esc(lastErr)}<br>
    <button class="btn" onclick="${retry}">Coba lagi</button>
    ${testUrl ? `<br><a href="${esc(testUrl)}" target="_blank" rel="noopener" class="link" style="display:inline-block;margin-top:12px">Tes alamat API di browser</a>` : ''}</div>`;
}

/* ---------- Navigasi ---------- */
const S_ = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const NAV = [
  {id:'gempa', label:'Gempa', svg:`<svg viewBox="0 0 24 24" ${S_}><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>`},
  {id:'cuaca', label:'Cuaca', svg:`<svg viewBox="0 0 24 24" ${S_}><path d="M17.5 19a4.5 4.5 0 100-9h-1.8A7 7 0 104 14.9"/><path d="M8 19h9.5"/></svg>`}
];
function buildNav(){
  const links = NAV.map(n => `<a class="nav" data-s="${n.id}" href="#${n.id}">${n.svg}<span>${n.label}</span></a>`).join('');
  $('#bottom').innerHTML = links;
  $('#side').innerHTML = `<div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></div>
    <div><h1>Info Nusachain</h1><p>Mobile DApp</p></div></div>${links}
    <div class="src">Sumber data:<br>BMKG (gempa & cuaca)<br>Emsifa (daftar wilayah)</div>`;
}
let RT = 0;
function go(h){ location.hash = h; }
function route(){
  RT++;
  const p = (location.hash.replace('#','') || 'gempa').split('/');
  const sec = ['gempa','cuaca'].includes(p[0]) ? p[0] : 'gempa';
  document.querySelectorAll('.nav').forEach(a => a.classList.toggle('on', a.dataset.s === sec));
  window.scrollTo(0, 0);
  if(sec === 'cuaca') cuacaPage();
  else gempaPage();
}
window.addEventListener('hashchange', route);

/* ================= GEMPA ================= */
const EQ_TABS = [
  {id:'terbaru', label:'Terbaru', file:'autogempa.json'},
  {id:'m5', label:'M 5.0+', file:'gempaterkini.json'},
  {id:'dirasakan', label:'Dirasakan', file:'gempadirasakan.json'}
];
let eqTab = 'terbaru';
const magCls = m => m >= 6 ? 'm3' : m >= 5 ? 'm2' : m >= 3 ? 'm1' : '';
function ago(iso){
  const t = Date.parse(iso); if(!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'baru saja'; if(m < 60) return m + ' menit lalu';
  const h = Math.round(m / 60); if(h < 24) return h + ' jam lalu';
  return Math.round(h / 24) + ' hari lalu';
}
const osm = g => { const [la, lo] = String(g.Coordinates || '').split(',').map(x => x.trim()); return la && lo ? `https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=7/${la}/${lo}` : ''; };

async function gempaPage(){
  const my = RT; loading();
  const tab = EQ_TABS.find(t => t.id === eqTab);
  let data;
  try{ data = await getJson(BMKG_EQ + tab.file, 60000); }catch(e){ if(my === RT) failed('gempaPage()', BMKG_EQ + tab.file); return; }
  if(my !== RT) return;
  const raw = data && data.Infogempa && data.Infogempa.gempa;
  const rows = Array.isArray(raw) ? raw : (raw ? [raw] : []);
  const tabs = `<div class="chips">${EQ_TABS.map(t => `<button class="chip ${t.id===eqTab?'on':''}" onclick="eqTab='${t.id}';gempaPage()">${t.label}</button>`).join('')}
    <button class="icon-btn" style="width:34px;height:34px;margin-left:auto" aria-label="Muat ulang" onclick="delete cache['${BMKG_EQ + tab.file}'];gempaPage()">&#8635;</button></div>`;
  const listHTML = list => `<div class="list w">${list.map(g => {
    const m = parseFloat(g.Magnitude), link = osm(g);
    return `<${link?`a href="${esc(link)}" target="_blank" rel="noopener"`:'div'} class="item">
      <span class="mag ${magCls(m)}">${esc(g.Magnitude)}</span>
      <span class="mid"><b>${esc(g.Wilayah)}</b><span>${esc(g.Tanggal)} · ${esc(g.Jam)} · Kedalaman ${esc(g.Kedalaman)}</span>
      ${g.Dirasakan ? `<br><span>Dirasakan: ${esc(g.Dirasakan)}</span>` : ''}</span></${link?'a':'div'}>`;
  }).join('')}</div>`;

  let body;
  if(!rows.length) body = '<div class="state">Belum ada data gempa.</div>';
  else if(eqTab === 'terbaru'){
    const g = rows[0], m = parseFloat(g.Magnitude), link = osm(g);
    const shake = g.Shakemap ? `${BMKG_EQ}${encodeURIComponent(g.Shakemap)}` : '';
    body = `<div class="two"><div>
      <div class="hero"><small>Gempa terbaru · ${esc(ago(g.DateTime))}</small>
        <div class="eq-hero" style="margin-top:8px"><div class="bigm">${esc(g.Magnitude)}</div><div class="wil">${esc(g.Wilayah)}</div></div>
        <div class="dt"><span>${esc(g.Tanggal)}</span><span>${esc(g.Jam)}</span></div></div>
      <div class="kv">
        <div><small>Kedalaman</small><b>${esc(g.Kedalaman)}</b></div>
        <div><small>Koordinat</small><b>${esc(g.Lintang)}, ${esc(g.Bujur)}</b></div>
        <div class="full"><small>Potensi</small><b>${esc(g.Potensi || '-')}</b></div>
        ${g.Dirasakan ? `<div class="full"><small>Dirasakan (skala MMI)</small><b>${esc(g.Dirasakan)}</b></div>` : ''}
      </div>
      ${link ? `<p style="margin-top:12px"><a class="link" href="${esc(link)}" target="_blank" rel="noopener">Lihat lokasi di peta</a></p>` : ''}
      </div><div>${shake ? `<img class="shake" src="${esc(shake)}" alt="Peta guncangan (shakemap) BMKG" onerror="this.outerHTML='<div class=&quot;state&quot;>Peta guncangan tidak tersedia.</div>'">` : ''}</div></div>`;
  }else body = listHTML(rows);

  $('#app').innerHTML = `<div class="bar"><h2>Informasi Gempa Bumi<small>Data resmi BMKG</small></h2></div>${tabs}${body}
    <p class="note">Sumber: BMKG. Data dapat diperbarui sewaktu-waktu. Untuk peringatan dini resmi, ikuti kanal BMKG.</p>`;
}

/* ================= CUACA (BMKG) + pilihan wilayah (Emsifa) ================= */
const wilList = (kind, id) => getJson(WIL + (kind === 'provinces' ? 'provinces.json' : `${kind}/${id}.json`), 86400000);
const adm4Of = id => `${id.slice(0,2)}.${id.slice(2,4)}.${id.slice(4,6)}.${id.slice(6)}`;
let loc = store.get('loc', {adm4:'31.71.03.1001', label:''});

function wxIcon(desc){
  const d = String(desc || '').toLowerCase();
  if(d.includes('petir')) return '⛈️';
  if(d.includes('hujan')) return d.includes('ringan') ? '🌦️' : '🌧️';
  if(d.includes('kabut') || d.includes('asap') || d.includes('kabur')) return '🌫️';
  if(d.includes('tebal')) return '☁️';
  if(d.includes('cerah berawan')) return '🌤️';
  if(d.includes('berawan')) return '⛅';
  if(d.includes('cerah')) return '☀️';
  return '🌡️';
}
const pdt = e => new Date(String(e.local_datetime || e.datetime || '').replace(' ', 'T').replace(/Z$/, ''));
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

// Kerangka halaman (pilihan wilayah) selalu tampil, walau data cuaca gagal dimuat
function cuacaPage(){
  const firstTime = !store.get('loc', null);
  $('#app').innerHTML = `
    <div class="bar"><h2>Prakiraan Cuaca<small id="wxloc">${esc(loc.label || loc.adm4)}</small></h2></div>
    <details class="pick" id="pk" ${firstTime ? 'open' : ''}><summary>Ubah lokasi</summary>
      <div class="picker">
        <select id="sp" aria-label="Provinsi"><option value="">Memuat provinsi…</option></select>
        <select id="sr" aria-label="Kabupaten/Kota" disabled><option value="">Kabupaten/Kota</option></select>
        <select id="sd" aria-label="Kecamatan" disabled><option value="">Kecamatan</option></select>
        <select id="sv" aria-label="Desa/Kelurahan" disabled><option value="">Desa/Kelurahan</option></select>
      </div>
      <p class="note" id="pkmsg" style="margin:0 0 12px"></p>
    </details>
    <div id="wx"></div>`;
  initPicker();
  loadWeather();
}

function initPicker(){
  const sp = $('#sp'), sr = $('#sr'), sd = $('#sd'), sv = $('#sv'); if(!sp) return;
  const names = {};
  const fill = (el, list, ph) => {
    el.innerHTML = `<option value="">${ph}</option>` + list.map(x => `<option value="${esc(x.id)}">${esc(title(x.name))}</option>`).join('');
    el.disabled = !list.length;
  };
  const reset = (...els) => els.forEach(el => { el.innerHTML = `<option value="">${el.getAttribute('aria-label')}</option>`; el.disabled = true; });
  const link = (el, kind, target, ph, rest, key) => el.addEventListener('change', async () => {
    reset(target, ...rest); if(!el.value) return;
    names[key] = el.options[el.selectedIndex].text;
    try{ fill(target, await wilList(kind, el.value), ph); }catch(e){ toast('Data wilayah gagal dimuat'); }
  });
  link(sp, 'regencies', sr, 'Kabupaten/Kota', [sd, sv], 'p');
  link(sr, 'districts', sd, 'Kecamatan', [sv], 'r');
  link(sd, 'villages', sv, 'Desa/Kelurahan', [], 'd');
  sv.addEventListener('change', () => {
    if(!sv.value) return;
    loc = {adm4:adm4Of(sv.value), label:[sv.options[sv.selectedIndex].text, names.d, names.r, names.p].join(', ')};
    store.set('loc', loc);
    $('#wxloc').textContent = loc.label; $('#pk').open = false;
    loadWeather();
  });
  window.loadProvinces = async () => {
    const my = RT, msg = $('#pkmsg'); if(!msg) return;
    sp.innerHTML = '<option value="">Memuat provinsi…</option>'; msg.textContent = '';
    try{
      const list = await wilList('provinces');
      if(my !== RT || !$('#sp')) return;
      fill(sp, list, 'Provinsi');
    }catch(e){
      if(my !== RT || !$('#pkmsg')) return;
      sp.innerHTML = '<option value="">Provinsi gagal dimuat</option>';
      msg.innerHTML = `${esc(lastErr)} <button class="link" style="border:0;background:none;cursor:pointer" onclick="loadProvinces()">Coba lagi</button>`;
    }
  };
  loadProvinces();
}

async function loadWeather(){
  const my = RT; if(!$('#wx')) return;
  $('#wx').innerHTML = '<div class="state"><div class="spin"></div>Memuat prakiraan…</div>';
  const url = BMKG_WX + encodeURIComponent(loc.adm4);
  let j;
  try{ j = await getJson(url, 900000); }
  catch(e){
    if(my !== RT || !$('#wx')) return;
    $('#wx').innerHTML = `<div class="state"><b>Prakiraan cuaca tidak bisa dimuat</b><br>${esc(lastErr)}<br>
      <button class="btn" onclick="loadWeather()">Coba lagi</button><br>
      <a href="${esc(url)}" target="_blank" rel="noopener" class="link" style="display:inline-block;margin-top:12px">Tes alamat API di browser</a></div>`;
    return;
  }
  if(my !== RT || !$('#wx')) return;
  const lk = j.lokasi || (j.data && j.data[0] && j.data[0].lokasi) || {};
  const entries = [];
  ((j.data && j.data[0] && j.data[0].cuaca) || []).forEach(day => (Array.isArray(day) ? day : [day]).forEach(e => entries.push(e)));
  entries.sort((a, b) => pdt(a) - pdt(b));
  if(!entries.length){ $('#wx').innerHTML = '<div class="state">Prakiraan untuk lokasi ini belum tersedia. Coba pilih desa/kelurahan lain.</div>'; return; }
  const now = new Date();
  let ci = 0, best = Infinity;
  entries.forEach((e, i) => { const d = Math.abs(pdt(e) - now); if(d < best){ best = d; ci = i; } });
  const c = entries[ci];
  const place = loc.label || [lk.desa, lk.kecamatan, lk.kotkab, lk.provinsi].filter(Boolean).map(title).join(', ') || loc.adm4;
  $('#wxloc').textContent = place;

  const hours = entries.slice(ci, ci + 8).map((e, i) => {
    const d = pdt(e);
    return `<div class="hr ${i===0?'cur':''}"><small>${pad(d.getHours())}:${pad(d.getMinutes())}</small><div class="e">${wxIcon(e.weather_desc)}</div><b>${esc(e.t)}°</b><small>${esc(e.hu)}%</small></div>`;
  }).join('');

  const days = {};
  entries.forEach(e => { const k = dayKey(pdt(e)); (days[k] = days[k] || []).push(e); });
  const daysHTML = Object.keys(days).map((k, idx) => {
    const list = days[k], d = pdt(list[0]);
    const ts = list.map(e => +e.t), cnt = {};
    list.forEach(e => cnt[e.weather_desc] = (cnt[e.weather_desc] || 0) + 1);
    const dom = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    const lbl = dayKey(now) === k ? 'Hari ini' : `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]}`;
    return `<details class="day" ${idx === 0 ? 'open' : ''}><summary><span class="e">${wxIcon(dom)}</span>
      <span class="s"><b>${lbl}</b><span>${esc(dom)}</span></span><span class="r">${Math.min(...ts)}° / ${Math.max(...ts)}°</span></summary>
      <div class="tbl-wrap"><table><thead><tr><th>Jam</th><th>Cuaca</th><th>Suhu</th><th>Lembap</th><th>Angin</th></tr></thead><tbody>
      ${list.map(e => { const t = pdt(e); return `<tr><td>${pad(t.getHours())}:${pad(t.getMinutes())}</td><td class="l">${wxIcon(e.weather_desc)} ${esc(e.weather_desc)}</td><td>${esc(e.t)}°C</td><td>${esc(e.hu)}%</td><td>${esc(e.ws)} km/j ${esc(e.wd)}</td></tr>`; }).join('')}
      </tbody></table></div></details>`;
  }).join('');

  $('#wx').innerHTML = `
    <div class="two"><div>
      <div class="hero"><small>${esc(place)}</small>
        <div class="wx-now" style="margin-top:8px"><div class="ico">${wxIcon(c.weather_desc)}</div>
          <div><div class="t">${esc(c.t)}°C</div><div class="d">${esc(c.weather_desc)}</div></div></div>
        <div class="stats"><div>Kelembapan<b>${esc(c.hu)}%</b></div><div>Angin<b>${esc(c.ws)} km/j ${esc(c.wd)}</b></div><div>Jarak pandang<b>${esc(c.vs_text || (c.vs ? c.vs + ' m' : '-'))}</b></div></div>
        <div class="dt"><span>${esc(HARI[pdt(c).getDay()])}, ${pdt(c).getDate()} ${BLN[pdt(c).getMonth()]} ${pdt(c).getFullYear()}</span><span>Zona waktu ${esc(lk.timezone || '')}</span></div></div>
      <h3 class="sec">24 jam ke depan</h3><div class="strip">${hours}</div>
    </div><div>
      <h3 class="sec">Prakiraan harian</h3>${daysHTML}
    </div></div>
    <p class="note">Sumber: BMKG (prakiraan cuaca per 3 jam). Data di-cache 15 menit untuk menghemat batas permintaan (60 per menit per IP). Daftar wilayah: Emsifa API Wilayah Indonesia.</p>`;
}

buildNav();
route();
</script>
</body>
</html>
