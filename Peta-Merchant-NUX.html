<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta Merchant NUX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}}
:root[data-theme="light"]{--bg:#f1f8f5;--card:#fff;--tx:#10281f;--mut:#58766a;--ac:#0a9d6e;--gd:#d98b00;--bd:#cfe3da;--er:#d63c3c}
:root[data-theme="dark"]{--bg:#07130f;--card:#0f2019;--tx:#e6f7ef;--mut:#86a89a;--ac:#2ee6a6;--gd:#f5b942;--bd:#1d3a2e;--er:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.w{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#8dffd6,var(--ac));display:inline-grid;place-items:center;color:#033;font-weight:800;font-size:.8rem;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem}
button.on{border-color:var(--ac);color:var(--ac)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 180px;min-width:0;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit}
.bar input:focus{outline:2px solid var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border-radius:20px}
#map{height:56vh;min-height:320px;border-radius:12px;border:1px solid var(--bd);margin-top:10px;z-index:0}
:root.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin span{transform:rotate(45deg);font-size:16px}
.me{background:#3b82f6;border:3px solid #fff;border-radius:50%}
.leaflet-popup-content{font-family:system-ui,sans-serif;font-size:.85rem;color:#10281f;margin:10px 12px}
.leaflet-popup-content b{font-size:.95rem}
.ct{color:var(--mut);font-size:.8rem;margin:10px 0 0}
.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}
.cd:hover{border-color:var(--ac)}
.cd b{display:block}.cd small{display:block;color:var(--mut)}
.bd{display:inline-block;font-size:.68rem;border-radius:10px;padding:1px 8px;margin:4px 4px 0 0;background:var(--bd);color:var(--ac)}
.bd.n{color:var(--gd)}
.go,a.go{display:inline-block;margin-top:6px;background:var(--ac);color:#033;font-weight:700;font-size:.78rem;border-radius:8px;padding:4px 10px;text-decoration:none;border:0}
.ex{font-size:.78rem;color:var(--mut);margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<header><h1><span class="logo">N</span><span id="ttl"></span></h1>
<div><button id="bi" onclick="SL('id')">ID</button> <button id="be" onclick="SL('en')">EN</button> <button onclick="T()">◐</button></div></header>
<div class="box">
<div class="bar"><input id="q" oninput="Q=this.value;render()" autocomplete="off"><button id="nb" onclick="near()"></button></div>
<div class="chips" id="ch"></div>
<div id="map"></div>
<p class="ct" id="ct"></p>
<div class="ls" id="ls"></div>
</div>
<p class="ex" id="ex"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ====== DATA MERCHANT ======
// Isi salah satu: (1) edit array MERCHANTS di bawah, atau (2) isi SHEET_CSV dengan link Google Sheets
// yang dipublikasikan sebagai CSV (File > Bagikan > Publikasikan ke web > CSV).
// Kolom CSV: nama,kategori,lat,lng,alamat,jam,telp,elnux,nux  (kategori: kafe/toko/jasa/hotel; elnux & nux: ya/tidak)
var SHEET_CSV='';
var MERCHANTS=[ // DATA CONTOH, ganti dengan merchant asli
{n:"Kopi Contoh A",c:"kafe",lat:-6.9905,lng:110.4230,a:"Alamat contoh, dekat Simpang Lima",h:"08.00–22.00",p:"",e:1,x:1},
{n:"Warung Contoh B",c:"kafe",lat:-6.9840,lng:110.4090,a:"Alamat contoh, Semarang",h:"07.00–21.00",p:"",e:1,x:0},
{n:"Toko Kelontong Contoh C",c:"toko",lat:-6.9780,lng:110.4160,a:"Alamat contoh, Semarang",h:"06.00–21.00",p:"",e:1,x:1},
{n:"Minimarket Contoh D",c:"toko",lat:-6.9990,lng:110.4310,a:"Alamat contoh, Semarang",h:"24 jam",p:"",e:0,x:1},
{n:"Bengkel Contoh E",c:"jasa",lat:-6.9950,lng:110.4020,a:"Alamat contoh, Semarang",h:"08.00–17.00",p:"",e:1,x:0},
{n:"Laundry Contoh F",c:"jasa",lat:-6.9700,lng:110.4400,a:"Alamat contoh, Semarang",h:"07.00–20.00",p:"",e:1,x:1},
{n:"Hotel Contoh G",c:"hotel",lat:-6.9667,lng:110.4290,a:"Alamat contoh, Semarang",h:"24 jam",p:"",e:0,x:1}];
// ===========================
var CAT={kafe:{e:'☕',c:'#f59e0b'},toko:{e:'🛒',c:'#3b82f6'},jasa:{e:'🔧',c:'#a855f7'},hotel:{e:'🏨',c:'#ef4444'},lain:{e:'📍',c:'#64748b'}};
var I={id:{ttl:"Peta Merchant NUX",ph:"Cari nama merchant…",nb:"📍 Dekat saya",all:"Semua",cat:{kafe:"Kafe & Resto",toko:"Toko",jasa:"Jasa",hotel:"Hotel",lain:"Lainnya"},
e:"Poin ELNUX",x:"Bayar NUX",rt:"Rute",km:"km",sh:"Menampilkan ",of:" dari ",mc:" merchant",empty:"Tidak ada merchant yang cocok.",geo:"Lokasi tidak tersedia. Izinkan akses lokasi di browser.",
ex:"Data pada peta ini masih contoh. Ganti isi MERCHANTS di bagian atas skrip, atau isi SHEET_CSV dengan link Google Sheets (CSV) agar daftar bisa diperbarui tanpa mengubah kode. Rute dibuka di Google Maps."},
en:{ttl:"NUX Merchant Map",ph:"Search merchant name…",nb:"📍 Near me",all:"All",cat:{kafe:"Cafe & Restaurant",toko:"Shop",jasa:"Services",hotel:"Hotel",lain:"Other"},
e:"ELNUX points",x:"Pay with NUX",rt:"Directions",km:"km",sh:"Showing ",of:" of ",mc:" merchants",empty:"No matching merchants.",geo:"Location unavailable. Allow location access in your browser.",
ex:"The data on this map is sample data. Replace MERCHANTS at the top of the script, or set SHEET_CSV to a Google Sheets (CSV) link so the list can be updated without touching code. Directions open in Google Maps."}};
var lang='id',D=[],Q='',CF='all',me=null,map,grp,meM,mk=[];
try{if(localStorage.getItem('pm_l'))lang=localStorage.getItem('pm_l');else if((navigator.language||'').slice(0,2)==='en')lang='en'}catch(e){}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cat(c){return CAT[c]?c:'lain'}
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function SL(l){lang=l;try{localStorage.setItem('pm_l',l)}catch(e){}ui()}
function dk(v){document.documentElement.classList.toggle('dk',v)}
function T(){var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=d==='dark'?'light':'dark';r.setAttribute('data-theme',n);dk(n==='dark')}
function ui(){var t=I[lang];document.documentElement.lang=lang;document.title=t.ttl;$('ttl').textContent=t.ttl;$('bi').className=lang==='id'?'on':'';$('be').className=lang==='en'?'on':'';
 $('q').placeholder=t.ph;$('nb').textContent=t.nb;$('ex').textContent=t.ex;
 var ks=['all'].concat(Object.keys(CAT));$('ch').innerHTML=ks.map(function(k){return '<button data-k="'+k+'" class="'+(CF===k?'on':'')+'" onclick="CF=this.dataset.k;ui()">'+(k==='all'?t.all:CAT[k].e+' '+t.cat[k])+'</button>'}).join('');render()}
function pop(m,d){var t=I[lang],c=cat(m.c);return '<b>'+esc(m.n)+'</b><br>'+CAT[c].e+' '+t.cat[c]+(m.a?'<br>'+esc(m.a):'')+(m.h?'<br>🕒 '+esc(m.h):'')+(m.p?'<br>📞 '+esc(m.p):'')+(d!=null?'<br>📏 '+d.toFixed(1)+' '+t.km:'')+'<br>'+(m.e?'<span class="bd">'+t.e+'</span>':'')+(m.x?'<span class="bd n">'+t.x+'</span>':'')+'<br><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+m.lat+','+m.lng+'">'+t.rt+'</a>'}
function render(){var t=I[lang],q=Q.trim().toLowerCase();
 var f=D.filter(function(m){return(CF==='all'||cat(m.c)===CF)&&(!q||m.n.toLowerCase().indexOf(q)>-1)});
 f.forEach(function(m){m.d=me?dist(me[0],me[1],m.lat,m.lng):null});
 if(me)f.sort(function(a,b){return a.d-b.d});
 grp.clearLayers();mk=[];
 f.forEach(function(m,i){var c=CAT[cat(m.c)],ic=L_.divIcon({className:'',html:'<div class="pin" style="background:'+c.c+'"><span>'+c.e+'</span></div>',iconSize:[34,34],iconAnchor:[8,34],popupAnchor:[9,-30]});
  var k=L_.marker([m.lat,m.lng],{icon:ic}).bindPopup(pop(m,m.d));k.addTo(grp);mk.push(k)});
 $('ct').textContent=t.sh+f.length+t.of+D.length+t.mc;
 $('ls').innerHTML=f.length?f.map(function(m,i){var c=cat(m.c);return '<div class="cd" onclick="go('+i+')"><b>'+esc(m.n)+'</b><small>'+CAT[c].e+' '+t.cat[c]+(m.d!=null?' · '+m.d.toFixed(1)+' '+t.km:'')+'</small><small>'+esc(m.a)+'</small>'+(m.e?'<span class="bd">'+t.e+'</span>':'')+(m.x?'<span class="bd n">'+t.x+'</span>':'')+'<br><a class="go" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="https://www.google.com/maps/dir/?api=1&destination='+m.lat+','+m.lng+'">'+t.rt+'</a></div>'}).join(''):'<p class="ct">'+t.empty+'</p>';
 window._f=f}
function go(i){var m=window._f[i];map.setView([m.lat,m.lng],16);mk[i].openPopup();$('map').scrollIntoView({behavior:'smooth',block:'center'})}
function fit(){var p=D.map(function(m){return[m.lat,m.lng]});if(p.length)map.fitBounds(p,{padding:[40,40],maxZoom:15})}
function near(){if(!navigator.geolocation){alert(I[lang].geo);return}
 navigator.geolocation.getCurrentPosition(function(p){me=[p.coords.latitude,p.coords.longitude];if(meM)meM.remove();meM=L_.marker(me,{icon:L_.divIcon({className:'',html:'<div class="me" style="width:16px;height:16px"></div>',iconSize:[16,16]})}).addTo(map);map.setView(me,14);render()},function(){alert(I[lang].geo)},{enableHighAccuracy:true,timeout:10000})}
function csv(t){var r=[],row=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.join('')!=='')r.push(row);row=[]}else c+=ch}row.push(c);if(row.join('')!=='')r.push(row);return r}
function yes(v){return /^(ya|y|1|true|yes)$/i.test((v||'').trim())}
function load(){if(!SHEET_CSV)return Promise.resolve(MERCHANTS);
 return fetch(SHEET_CSV,{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){var r=csv(t),h=r.shift().map(function(x){return x.trim().toLowerCase()});
  function g(row,k){var i=h.indexOf(k);return i>-1?row[i]:''}
  return r.map(function(w){return{n:g(w,'nama'),c:(g(w,'kategori')||'lain').trim().toLowerCase(),lat:parseFloat(g(w,'lat')),lng:parseFloat(g(w,'lng')),a:g(w,'alamat'),h:g(w,'jam'),p:g(w,'telp'),e:yes(g(w,'elnux'))?1:0,x:yes(g(w,'nux'))?1:0}}).filter(function(m){return m.n&&isFinite(m.lat)&&isFinite(m.lng)})}).catch(function(){return MERCHANTS})}
var L_=window.L;
map=L_.map('map',{zoomControl:true}).setView([-6.9905,110.4230],13);
L_.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
grp=L_.layerGroup().addTo(map);
var th=document.documentElement.getAttribute('data-theme');dk(th?th==='dark':matchMedia('(prefers-color-scheme:dark)').matches);
ui();
load().then(function(d){D=d;render();fit()});
</script>
</body>
</html>
