<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Prompt Kustom - Travel Notes Poster</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 650px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .output-box {
            margin-top: 25px;
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
        }
        .output-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #4a5568;
        }
        textarea {
            width: 100%;
            height: 250px;
            font-family: 'Courier New', Courier, monospace;
            background: #edf2f7;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-copy {
            background-color: #48bb78;
            margin-top: 10px;
        }
        .btn-copy:hover {
            background-color: #38a169;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Travel Notes Prompt Generator 📝</h2>
    
    <div class="form-group">
        <label for="tanggal">Tanggal:</label>
        <input type="text" id="tanggal" placeholder="Contoh: 20 Agustus 2026">
    </div>

    <div class="form-group">
        <label for="lokasi">Lokasi / Judul:</label>
        <input type="text" id="lokasi" placeholder="Contoh: Banda Aceh">
    </div>

    <div class="form-group">
        <label for="keywords">Tiga Kata Kunci (Bahasa Inggris):</label>
        <input type="text" id="keywords" placeholder="Contoh: MODERN, SERENE, HOME">
    </div>

    <button onclick="generatePrompt()">Buat Prompt Lengkap</button>

    <div class="output-box" id="resultBox" style="display: none;">
        <h3>Hasil Prompt (Siap disalin ke AI beserta instruksi master):</h3>
        <textarea id="outputText" readonly></textarea>
        <button class="btn-copy" onclick="copyToClipboard()">Salin Teks</button>
    </div>
</div>

<script>
    function generatePrompt() {
        const tanggal = document.getElementById('tanggal').value || '{Tanggal}';
        const lokasi = document.getElementById('lokasi').value || '{Lokasi}';
        const keywords = document.getElementById('keywords').value || '{Kata Kunci}';

        // Teks instruksi master panjang yang diintegrasikan
        const masterInstruction = `Silakan buat "Rubber Stamp Travel Field Notes Poster" (Poster Catatan Perjalanan Cap Stempel Karet) yang terpisah untuk setiap foto yang saya unggah, dengan menghasilkan setiap foto secara individual tanpa kolase atau kombinasi multi-gambar.

Secara keseluruhan, gunakan komposisi lanskap 4:3, yang membagi bingkai menjadi wilayah kiri dan kanan, tetapi tanpa menggambar garis pembagi yang jelas.

Sisi kiri mengambil sekitar 58% dari bingkai, dengan mempertahankan foto aslinya secara setia. Pertahankan identitas subjek utama, medan, arsitektur, tumbuhan, orang, hubungan spasial, pencahayaan dan bayangan alami, tekstur autentik, serta atmosfer warna asli secara akurat; terapkan hanya perataan warna (color grading) foto setingkat publikasi seni yang terkendali, dan tambahkan derau film (film noise) berbutir halus yang sangat samar. Untuk adaptasi tata letak, pemotongan alami (natural cropping) diperbolehkan, tetapi jangan meregangkan, mendistorsi, menggeser, mengganti, atau menggambar ulang subjek utama.

Sisi kanan mengambil sekitar 42% dari bingkai, menggunakan kertas kuno berwarna putih gading (off-white) yang hangat sebagai latar belakang. Kertas ini menampilkan serat-serat halus, butiran alami, bekas penggunaan ringan, dan tekstur matte, sembari mempertahankan area luas kertas kosong tanpa cetakan, menjadikan ruang kosong tersebut sebagai bagian penting dari tata letak.

Analisis foto asli dan ekstrak garis luar subjek, struktur arsitektur, kontur medan, bentuk tumbuhan, jalan, garis pantai, atau hubungan visual utama lainnya yang paling khas dari lokasi tersebut, lalu kompres menjadi gambar stempel karet multi-warna yang kecil.

Jangan mereplikasi setiap elemen dari foto satu per satu. Pertahankan hanya informasi minimal yang diperlukan agar lokasi asli, subjek, dan hubungan pemandangan dapat langsung dikenali. Hapus kerumunan orang, kendaraan, jendela yang padat, bangunan yang berulang, vegetasi yang terfragmentasi, elemen dekoratif, dan latar belakang yang tidak relevan.

Stempel ditempatkan di bagian tengah-bawah area kertas sisi kanan, hanya menempati sekitar 30%–38% dari tinggi wilayah kanan, dengan banyak ruang kosong yang dipertahankan di sekitarnya. Stempel tidak boleh diperbesar menjadi ilustrasi standar, lukisan lanskap penuh, atau logo merek.

Tentukan pengaturan stempel berdasarkan komposisi foto asli:
- Arsitektur ikonik: Pertahankan kontur luar yang paling khas, atap, kubah, lengkungan, menara, atau struktur utama.
- Permukiman pegunungan: Kompres bangunan menjadi beberapa blok warna berundak yang selaras dengan medan.
- Pemandangan pesisir: Pertahankan kontur gunung, lapisan permukiman, garis pantai, dan riak air yang jarang serta terputus-putus.
- Panorama kota: Pertahankan cakrawala (skyline) utama, satu bangunan ikonik, dan satu atau dua lapisan pegunungan yang jauh.
- Lanskap alam: Pertahankan bentuk gunung utama, pohon, garis pantai, atau orientasi jalan.
- Oklusi latar depan (foreground occlusions): Jika penting secara naratif dalam foto asli, pertahankan sebagai garis luar stempel latar depan.

Ekstrak 2–4 warna tinta cetak (spot inks) dari foto asli. Prioritaskan warna-warna desaturasi seperti hitam karbon, hijau tua, merah bata, kuning oker, biru abu-abu (slate blue), atau cokelat taupe, tetapi jangan memaksakan palet warna yang kaku. Pertahankan karakter warna yang paling khas dari foto asli, dengan hanya memberikan sedikit area warna untuk penekanan visual.

Render setiap warna sebagai efek cap tangan yang terpisah:
Tekstur ukiran stempel karet yang autentik, bekas pahatan tangan, lebar garis yang tidak rata, takikan kontur, tepi yang retak, kekurangan tinta kering, bayangan kertas yang tembus (paper show-through), tinta berbutir, tekanan yang tidak rata, bayangan parsial (partial ghosting), dan sedikit meleset (misregistration) sekitar 1–2 mm.

Izinkan ketidaksejajaran alami antar lapisan warna; bagian tepi tidak boleh dihaluskan secara digital. Hasil cetakan harus menyerupai stempel ukir asli yang ditekan pada kertas kuno, bukan foto yang difilter, ilustrasi vektor yang halus, atau logo seni garis (line-art logo).

Hasilkan teks berdasarkan lokasi, tema, dan citra visual foto dengan format berikut:
${lokasi}
No. [Otomatis dimasukkan sistem AI]
${keywords}
${tanggal}

Tempatkan teks di bawah atau di samping stempel di ruang kosong, menggunakan font mesin tik yang kecil, terkendali, dan sedikit tidak sempurna secara mekanis. Tipografi tersebut harus membangkitkan kesan catatan lapangan seorang penjelajah, bukan tajuk iklan. Pastikan semua teks dieja dengan akurat, tanpa menambahkan slogan, merek, atau salinan dekoratif yang tidak relevan.

Nuansa keseluruhannya seperti catatan lapangan yang disimpan oleh seorang arsitek, penulis perjalanan, atau pengamat alam: tenang, terkendali, nyata secara taktil, spesifik secara regional, dengan ketidaksempurnaan buatan tangan dan kesan yang layak dikoleksi. Foto menangani rekaman di lokasi; stempel menangkap fragmen ingatan yang paling mudah dikenali.

Tanggal wajib menampilkan tanggal ini secara persis: ${tanggal}

Hindari: Garis pembagi tengah yang jelas, segel melingkar, stempel merah Tiongkok, perforasi prangko, segel lilin, kolase stiker, templat suvenir wisata, logo vektor halus, ikon kota umum, replikasi penuh semua arsitektur, detail yang padat, keterampilan tangan yang kekanak-kanakan, gaya kartun, rendering 3D, tekstur plastik, gradien digital mengkilap (glossy), saturasi berlebih, teks berlebihan, kekacauan dekoratif, dan menggambar ulang atau mengubah foto asli sisi kiri.`;

        // Memasukkan gabungan teks ke dalam textarea
        document.getElementById('outputText').value = masterInstruction;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyToClipboard() {
        const copyText = document.getElementById('outputText');
