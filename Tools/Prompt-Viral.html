<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Prompt Travel Notes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .output-box {
            margin-top: 25px;
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            position: relative;
        }
        .output-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: #4a5568;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            background: #edf2f7;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 0;
        }
        .btn-copy {
            background-color: #48bb78;
            margin-top: 10px;
        }
        .btn-copy:hover {
            background-color: #38a169;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Prompt Generator 📝</h2>
    
    <div class="form-group">
        <label for="tanggal">Tanggal:</label>
        <input type="text" id="tanggal" placeholder="Contoh: 20 Agustus 2026">
    </div>

    <div class="form-group">
        <label for="lokasi">Lokasi / Judul:</label>
        <input type="text" id="lokasi" placeholder="Contoh: Banda Aceh">
    </div>

    <div class="form-group">
        <label for="keywords">Tiga Kata Kunci (Pisahkan dengan koma):</label>
        <input type="text" id="keywords" placeholder="Contoh: MODERN, SERENE, HOME">
    </div>

    <button onclick="generatePrompt()">Buat Prompt</button>

    <div class="output-box" id="resultBox" style="display: none;">
        <h3>Hasil Prompt:</h3>
        <pre id="outputText"></pre>
        <button class="btn-copy" onclick="copyToClipboard()">Salin Teks</button>
    </div>
</div>

<script>
    function generatePrompt() {
        const tanggal = document.getElementById('tanggal').value || '{Tanggal Kosong}';
        const lokasi = document.getElementById('lokasi').value || '{Lokasi Kosong}';
        const keywords = document.getElementById('keywords').value || '{Kata Kunci Kosong}';

        // Format prompt yang akan dihasilkan
        const promptTemplate = `${tanggal}\n${lokasi}\n${keywords}`;

        document.getElementById('outputText').innerText = promptTemplate;
        document.getElementById('resultBox').style.display = 'block';
    </div>

    function copyToClipboard() {
        const text = document.getElementById('outputText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Prompt berhasil disalin ke clipboard!');
        }).catch(err => {
            alert('Gagal menyalin teks: ', err);
        });
    }
</script>

</body>
</html>
